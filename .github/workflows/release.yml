name: 发布安装包

# 触发方式：
#   1. 推 tag（v0.3.0）→ 自动构建并发布 Release
#   2. 手动 Actions 页面点「Run workflow」→ 只构建，产物在 Artifacts 里下载（不发布）
#
# 用户最终看到的是 Releases 页面上的四个文件：
#   zhiwen-client-Windows-x64-setup.exe  （Windows 安装版：开始菜单 + 可选开机自启 + 可卸载）
#   zhiwen-client-Windows-x64.exe        （Windows 免安装版：拷到哪都能跑）
#   zhiwen-client-Linux-x86_64           （Linux，chmod +x 后直接跑）
#   zhiwen-client-macOS.zip              （macOS，解压后右键打开）
#
# Windows 安装包用 Inno Setup 6 编译（packaging/windows/zhiwen-client.iss）。
# 文件名全部纯 ASCII：含中文的 artifact 名在 upload/download/Release 链上会被截断
# （实测被截成 "-Windows.exe"），这个坑踩过一次就够了。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            # 纯 ASCII：含中文的 artifact 名在多步传递中会被截断成 "-Windows.exe"
            artifact: zhiwen-client-Windows-x64.exe
          - os: ubuntu-latest
            label: Linux-x86_64
            artifact: zhiwen-client-Linux-x86_64
          - os: macos-latest
            label: macOS
            artifact: zhiwen-client-macOS.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # 两个包都要装：客户端只用到 core，但测试套件覆盖 hub（设备注册表/面板）。
          # 只装 core 会在 CI 里报 ModuleNotFoundError: zw_hub —— 本地能过是因为之前装过。
          python -m pip install -e ./core -e ./hub
          python -m pip install pyinstaller

      - name: 跑单元测试（打包前先确认代码是好的）
        shell: bash
        run: |
          python -m pip install pytest pytest-asyncio pytest-timeout
          # 跑全套：core + hub 的测试都在这里，出问题早发现。
          # 注意上面必须同时装 ./core 与 ./hub，否则 hub 的测试 import 失败
          # （本地"能过"常常是因为之前已经装过 hub，CI 是干净的，会直接暴露）。
          # --timeout：任何用例超过 90 秒直接失败并报出名字。
          # 没有这个的话，"某个用例在 Windows 上卡住"会表现成整个 job
          # 静默挂几十分钟，极难定位（真的这样浪费过两轮 CI）。
          python -m pytest tests -q --timeout=90 --timeout-method=thread

      - name: 构建可执行文件
        shell: bash
        run: python -m PyInstaller packaging/zhiwen-client.spec --noconfirm

      - name: 冒烟测试（产物能跑起来，不是坏文件）
        shell: bash
        run: |
          # 打包最常见的坑是"能构建、一跑就 ModuleNotFound"（比如 datas 里的
          # 控制台页面没打进去、uvicorn 的后端模块没被静态分析到）。
          # --selftest 把客户端真正用到的依赖逐项走一遍，且不需要图形界面。
          #
          # 跨平台注意：macOS **没有** timeout 命令（那是 GNU coreutils），
          # 所以不能用 `timeout 120 ...`，否则 127 command not found。
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="dist/zhiwen-client.exe"
            REPORT="$LOCALAPPDATA/zhiwen-client/selftest.txt"
          else
            BIN="dist/zhiwen-client"
            REPORT="$HOME/.config/zhiwen-client/selftest.txt"
          fi
          ls -la "$BIN"
          chmod +x "$BIN" 2>/dev/null || true

          # 后台跑 + 自己数秒，充当可移植的 timeout
          rm -f "$REPORT"
          "$BIN" --selftest > selftest.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "selftest 超时（GUI 消息框可能阻塞），杀掉后改看报告文件"
            kill -9 "$PID" 2>/dev/null || true
            cat "$REPORT" 2>/dev/null || true
            grep -q "全部" "$REPORT"
          else
            wait "$PID"
            CODE=$?
            cat selftest.log 2>/dev/null || true
            if [ "$CODE" != "0" ]; then
              echo "selftest 退出码 $CODE"
              cat "$REPORT" 2>/dev/null || true
              exit "$CODE"
            fi
          fi

      # ── Windows 安装包（Inno Setup 6）────────────────────────────────────
      # 下面三步只在 Windows 上跑；Linux/macOS 不需要安装引导程序。
      # 顺序：先准备好工具 → 静态检查 .iss → 编译。检查放在编译前，
      # 是为了让"脚本写错"在 30 秒内失败，而不是等到编译输出的几百行里找。
      - name: 准备 Inno Setup（runner 通常已预装）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # windows-latest 镜像一般自带 Inno Setup 6，路径固定在
          #   C:\Program Files (x86)\Inno Setup 6\ISCC.exe
          # 但不是所有镜像版本都有，所以找不到就用 chocolatey 装（runner 自带 choco）。
          ISCC=""
          for c in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
                   "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [ -f "$c" ]; then ISCC="$c"; break; fi
          done
          if [ -z "$ISCC" ]; then
            echo "没找到预装的 Inno Setup 6，改用 chocolatey 安装"
            choco install innosetup -y --no-progress
            for c in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
                     "/c/Program Files/Inno Setup 6/ISCC.exe"; do
              if [ -f "$c" ]; then ISCC="$c"; break; fi
            done
          fi
          if [ -z "$ISCC" ]; then
            echo "装了也找不到 ISCC.exe，安装包这一步没法继续" >&2
            exit 1
          fi
          echo "ISCC=$ISCC" >> "$GITHUB_ENV"
          echo "INNO_DIR=$(dirname "$ISCC")" >> "$GITHUB_ENV"
          echo "用 $ISCC"
          ls -la "$(dirname "$ISCC")" | head -20

      - name: 静态检查安装脚本（不需要 Windows 语义，几秒出结果）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # 版本号：tag（v0.3.0）优先；手动触发时读 core 里的 __version__，
          # 免得 release 页面上的版本号和包里的对不上。
          VER=""
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('core/src/zw_core/__init__.py').read_text(encoding='utf-8')).group(1))")"
          fi
          # [Messages] 键名优先用 runner 上真实的 Default.isl 校验（最准）；
          # 万一没装到那里，脚本会退回仓库里的名字快照。
          if [ -f "$INNO_DIR/Default.isl" ]; then
            python packaging/windows/check-iss.py --version "$VER" --default-isl "$INNO_DIR/Default.isl"
          else
            python packaging/windows/check-iss.py --version "$VER"
          fi

      - name: 编译 Windows 安装包
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VER=""
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('core/src/zw_core/__init__.py').read_text(encoding='utf-8')).group(1))")"
          fi
          # Windows 文件属性里的版本必须是四段纯数字（x.y.z.w）
          case "$VER" in
            *.*.*.*) VER4="$VER" ;;
            *.*.*)   VER4="$VER.0" ;;
            *.*)     VER4="$VER.0.0" ;;
            *)       VER4="$VER.0.0.0" ;;
          esac
          echo "安装包版本：$VER（文件属性 $VER4）"

          # cd 到脚本目录再编译：OutputDir=..\..\dist 无论按"脚本目录"还是
          # "当前目录"解释，都会落在仓库根的 dist\ 下，少一个不确定因素。
          cd packaging/windows
          # MSYS_NO_PATHCONV：git-bash 会把 /DMyAppVersion=... 这类参数当路径改写，
          # 关掉它，否则 ISCC 收到的参数是坏的（这个坑在别的项目上踩过）。
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' \
            "$ISCC" /DMyAppVersion="$VER" /DMyAppVersion4="$VER4" zhiwen-client.iss

          cd "${{ github.workspace }}"
          echo "--- 找安装包产物 ---"
          ls -la dist/ | grep -i setup || true
          ls -la packaging/windows/ | grep -i setup || true

      - name: 产物重命名
        shell: bash
        run: |
          # 注意：所有 cd 都用绝对路径，别靠当前位置。
          # 之前 macOS 分支在 `cd dist` 之后才 mkdir out，于是 out/ 建到了 dist/ 里，
          # 最后 ls out/ 报 "No such file or directory" —— zip 都成功了却判失败。
          OUT="${{ github.workspace }}/out"
          mkdir -p "$OUT"
          cd "${{ github.workspace }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "dist/zhiwen-client.exe" "$OUT/${{ matrix.artifact }}"
            # 安装包：ISCC 的 OutputDir 是相对脚本目录的 ..\..\dist，
            # 但为防解释差异，两处都找一遍再拷贝。
            SETUP="zhiwen-client-Windows-x64-setup.exe"
            for cand in "dist/$SETUP" "packaging/windows/$SETUP"; do
              if [ -f "$cand" ]; then cp "$cand" "$OUT/$SETUP"; break; fi
            done
            if [ ! -f "$OUT/$SETUP" ]; then
              echo "没找到安装包产物 $SETUP（Inno Setup 那一步没成功？）" >&2
              exit 1
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cd "${{ github.workspace }}/dist"
            ls -la
            if [ -d "知纹客户端.app" ]; then
              TARGET="知纹客户端.app"
            elif [ -f "zhiwen-client" ]; then
              TARGET="zhiwen-client"
            else
              echo "dist 里找不到可打包的产物" >&2
              exit 1
            fi
            echo "打包 $TARGET"
            zip -ry "$OUT/${{ matrix.artifact }}" "$TARGET"
          else
            cp "dist/zhiwen-client" "$OUT/${{ matrix.artifact }}"
            chmod +x "$OUT/${{ matrix.artifact }}"
          fi
          ls -la "$OUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error

      - name: 上传 Windows 安装包
        # 单独一个 artifact：名字必须是纯 ASCII，且与上面那个分开，
        # 免得"安装版"和"免安装版"在下游 merge-multiple 时互相覆盖。
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zhiwen-client-Windows-x64-setup.exe
          path: out/zhiwen-client-Windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          ls -la
          sha256sum * > SHA256SUMS.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 写发布说明
        run: |
          cat > NOTES.md <<'EOF'
          ## 下载哪个

          | 系统 | 文件 | 怎么用 |
          |---|---|---|
          | **Windows 10/11（推荐）** | `zhiwen-client-Windows-x64-setup.exe` | 双击安装。装完有开始菜单项，可选开机自启，以后从「设置 → 应用」就能卸载 |
          | Windows 10/11（免安装） | `zhiwen-client-Windows-x64.exe` | 拷到哪都能跑，双击即用，不弹黑框。不想装东西就选这个 |
          | Linux x86_64 | `zhiwen-client-Linux-x86_64` | `chmod +x` 后直接运行 |
          | macOS | `zhiwen-client-macOS.zip` | 解压后右键「打开」（未签名） |

          Windows 两个文件功能完全一样，只是"装"和"免装"的区别：
          安装版会写进开始菜单、可勾「开机自动启动」（随时能在 Windows
          「设置 → 应用 → 启动」里关掉），卸载时清理干净；免安装版删掉文件即卸载。

          首次运行可能被 SmartScreen 提示（未签名）→「更多信息」→「仍要运行」。

          ## 第一次用

          1. 打开后只填一个**服务器地址**（例如 `192.168.3.5:8700`）
          2. 点「连接并开始」
          3. 会自动打开本机控制台 `http://127.0.0.1:8730`

          服务器端不需要对接码（除非部署时设了 `ZW_HUB_TOKEN`，那就要填对接码）。

          机器码在首次启动时自动生成，存在本机配置里（卸载不会删它，重装还是同一台机器）。
          服务器端管理面板可以按机器码踢掉某台电脑。

          ## 服务器端

          管理面板：`http://<你的服务器>:8700/panel`（默认登录 `pscly` / `REDACTED_PANEL_PASSWORD`，可用环境变量覆盖）

          详见仓库里的 `docs/11-客户端与服务器端.md`。
          EOF

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 知纹 ${{ github.ref_name }}
          body_path: NOTES.md
          files: |
            artifacts/*
          draft: false
          prerelease: false
