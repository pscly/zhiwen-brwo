name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: 安装依赖
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ./core -e ./hub
          uv pip install --python .venv/bin/python pytest
      - name: 单元测试
        run: .venv/bin/python -m pytest tests -q
      - name: hub 冒烟
        run: |
          ZW_DATA_DIR=/tmp/hub ZW_HUB_PORT=8710 .venv/bin/python -m zw_hub.main &
          sleep 4
          curl -fsS http://127.0.0.1:8710/healthz
