name: CI

on:
  push:
    branches: [main]
  pull_request:

# 与 release.yml 同理：所有脚本都打印中文，统一 UTF-8。
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: 安装依赖
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ./core -e ./hub
          uv pip install --python .venv/bin/python pytest pytest-asyncio
      - name: 单元测试
        # 含真起 hub 子进程的同步集成测试，不需要浏览器也不花钱
        run: .venv/bin/python -m pytest tests -q
      - name: hub 冒烟（真进程）
        run: |
          ZW_DATA_DIR=/tmp/hub ZW_HUB_PORT=8710 .venv/bin/python -m zw_hub.main &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8710/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8710/healthz
          curl -fsS http://127.0.0.1:8710/readyz
      - name: 检查控制台没有语法错误
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path("core/src/zw_core/web/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          assert blocks, "控制台里没有找到 <script>"
          pathlib.Path("/tmp/ui.js").write_text("\n".join(blocks), encoding="utf-8")
          print(f"提取 {len(blocks)} 个 script 块，共 {sum(len(b) for b in blocks)} 字符")
          # 基本健全性：不应该引用任何外部资源（内网离线环境要求）
          for bad in ("http://cdn", "https://cdn", "unpkg.com", "jsdelivr", "googleapis"):
              assert bad not in html, f"控制台引用了外部资源：{bad}"
          print("没有外部依赖 ✓")
          PY
          node --check /tmp/ui.js
          echo "控制台 JS 语法 OK"
      - name: 文档与代码一致性（错误码 / 端点清单 / 控制台约束）
        # 这些是"加东西忘了同步"的守门人，曾经真的漏过：
        # 错误码没进文档、AI 清单里的路径多了一对花括号、控制台重复 id。
        run: .venv/bin/python -m pytest tests/test_docs_consistency.py -q
      - name: Windows 安装脚本静态检查（跨平台，PR 时就能发现 .iss 写错）
        # 不需要 Windows：check-iss.py 做的是语法/编码/路径/消息名检查，
        # 真正的编译在 release.yml 的 windows job 里。
        run: python packaging/windows/check-iss.py
      - name: 检查文档里引用的脚本都存在
        run: |
          python - <<'PY'
          import pathlib, re
          missing = []
          for doc in pathlib.Path("docs").glob("*.md"):
              text = doc.read_text(encoding="utf-8")
              for m in re.finditer(r"`(scripts/[\w\-./]+)`", text):
                  p = pathlib.Path(m.group(1))
                  if not p.exists():
                      missing.append(f"{doc.name} -> {m.group(1)}")
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          for m in re.finditer(r"`(scripts/[\w\-./]+)`", readme):
              p = pathlib.Path(m.group(1))
              if not p.exists():
                  missing.append(f"README.md -> {m.group(1)}")
          if missing:
              raise SystemExit("文档引用了不存在的脚本：\n" + "\n".join(missing))
          print("文档里的脚本引用都有效 ✓")
          PY
