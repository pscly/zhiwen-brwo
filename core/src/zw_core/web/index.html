/* ============================================================================
   20 · 事件委托
   整个界面只有一个 click 监听 + 一个 input 监听。新增按钮不需要挂任何监听，
   只要给它 data-act 就能跑——这是这个文件能维持在千余行的原因之一。
   ========================================================================== */
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function onAct(act, node, ev) {
  const id = node.dataset.id;
  switch (act) {
    case 'start': case 'stop': case 'restart': case 'unlock':
      profileAction(id, act); break;
    case 'cdp': openCdpDialog(id); break;
    case 'probe': openProbeDialog(id); break;
    case 'probe-inline': loadProbeInline(id); break;
    case 'detail': openProfileDetail(id); break;
    case 'edit-profile': {
      const p = S.profiles.find((x) => x.id === id);
      if (p) { closeDrawer(); openProfileForm(p); }
      break;
    }
    case 'new-profile': openProfileForm(null); break;
    case 'more': openProfileMore(node, id); break;
    case 'batch': batchAction(node.dataset.batch); break;
    case 'batch-delete': batchDelete(Array.from(S.sel)); break;
    case 'batch-cookie-clear': {
      const ids = Array.from(S.sel);
      confirmDanger({
        title: '批量清空 cookie', tone: 'bad',
        body: `${ids.length} 个环境的 cookie 会被全部清除。`,
        confirmText: 'CLEAR', okLabel: '清空',
        async action() { await clearCookies(ids); },
      });
      break;
    }
    case 'batch-trim': {
      // 后端只有全局清理，没有按环境清；说清楚比假装"只清选中的"更负责
      confirmDanger({
        title: '清理缓存', sub: '后端提供的是全局清理接口',
        body: `当前后端只有 <span class="mono">POST /api/v1/maintenance/trim</span>，会清理<b>所有已停止环境</b>的缓存（不只选中的 ${S.sel.size} 个）。运行中的环境不受影响。`,
        confirmText: 'TRIM', okLabel: '开始清理',
        async action() { await maintenanceOp('trim'); },
      });
      break;
    }
    case 'batch-sync': {
      (async () => {
        const pw = await syncPassword();
        if (!pw) return;
        const ids = Array.from(S.sel);
        let ok = 0; const errs = [];
        for (const pid of ids) {
          try { await api('POST', `/api/v1/sync/${encodeURIComponent(pid)}/push`, { password: pw, cross_machine: true }); ok++; }
          catch (e) { errs.push(`${pid.slice(0, 8)}: ${e.message}`); }
        }
        toast(`推送完成：${ok}/${ids.length}`, errs.length ? 'pending' : 'ok', { detail: errs.join('\n') });
        await loadSync(true);
        renderView({ soft: true });
      })();
      break;
    }
    case 'batch-export': {
      const ids = Array.from(S.sel);
      (async () => { for (const pid of ids) await exportProfile(pid); })();
      break;
    }
    case 'sel-clear': S.sel.clear(); renderView({ soft: true }); break;
    case 'goto-group': S.filters.group = node.dataset.group; switchView('profiles'); break;
    case 'ev-toggle': {
      const box = $(`[data-ev-detail="${node.dataset.ev}"]`);
      if (box) box.classList.toggle('hidden');
      break;
    }
    case 'doctor-toggle': {
      const i = node.dataset.di;
      S.ops.doctorOpen[i] = !S.ops.doctorOpen[i];
      renderView({ soft: true });
      break;
    }
    case 'op': maintenanceOp(node.dataset.op); break;
    case 'doctor': runDoctor(); break;
    case 'copy': copyText(node.dataset.copy || ''); break;
    case 'reload-view': refreshView({ force: true }); break;
    case 'dlg-close': closeDialog(); break;
    case 'drawer-close': closeDrawer(); break;
    case 'toast-close': removeToast(node.closest('.toast')); break;
    case 'toast-more': node.closest('.toast').classList.toggle('open'); break;

    case 'ext-install': openExtInstall(); break;
    case 'shell-toggle': {
      const on = (S.shell || {}).enabled !== false;
      api('POST', '/api/v1/shell/enable', { enabled: !on })
        .then(() => { toast(!on ? '远程执行已开启' : '远程执行已关闭（服务器拉不到命令）', 'ok'); return loadShell(true); })
        .then(() => render())
        .catch((e) => toastErr(e, '切换失败'));
      break;
    }
    case 'engine-install':
      api('POST', '/api/v1/engine/install')
        .then((r) => {
          toast(r && r.started ? '已开始下载内核（进度看本卡片）' : '已在下载中', 'ok');
          return loadEngine(true);
        })
        .then(() => render())
        .catch((e) => toastErr(e, '下载内核失败'));
      break;
    case 'pack-import': openPackImport(); break;
    case 'pack-pull': {
      // 从控制台（hub）拉包。以前网页控制台**没有这个入口** ——
      // 只有桌面 GUI 有，浏览器里打开就干不了这件事。
      toast('正在从控制台拉取 …');
      api('POST', '/api/v1/packs/pull-hub')
        .then((d) => {
          const added = (d && d.added) || [];
          const skipped = (d && d.skipped) || [];
          if (added.length) toast(`拉下 ${added.length} 个：${added.join('、')}`, 'ok');
          else if (skipped.length) toast(`没有新包（${skipped[0]}）`);
          else toast('控制台里还没有扩展包');
          render();
        })
        .catch((e) => toastErr(e, '拉取失败'));
      break;
    }
    case 'pack-push': {
      // 上传本机包到控制台。控制台要 zip，以前没有任何地方能产出它。
      toast('正在上传到控制台 …');
      api('POST', '/api/v1/packs/push-hub')
        .then((d) => {
          const pushed = (d && d.pushed) || [];
          const skipped = (d && d.skipped) || [];
          if (pushed.length) toast(`已上传 ${pushed.length} 个：${pushed.join('、')}`, 'ok');
          else if (skipped.length) toast(`没有上传（${skipped[0]}）`);
          else toast('本机还没有扩展包');
        })
        .catch((e) => toastErr(e, '上传失败'));
      break;
    }
    case 'pack-default': {
      // `onAct` 是同步函数，这里不能 await —— 用 then 链，跟 file 里其它动作一致。
      const on = node.dataset.on === '1';
      api('POST', `/api/v1/packs/${encodeURIComponent(node.dataset.id)}/default`, { enabled: on })
        .then(() => {
          toast(on ? '已设为新建环境默认带上' : '已取消默认', 'ok');
          return loadPacks(true);
        })
        .then(() => render())
        .catch((e) => toastErr(e, '设置失败'));
      break;
    }
    case 'svc-takeover': {
      // 远程升级后"版本号没变"的正解：让新装的那份接管端口，
      // 而不是手动杀进程（杀的那个往往正是提供命令通道的 core，一杀就断线）。
      api('POST', '/api/v1/service/takeover', {})
        .then(() => {
          toast('已安排接管，2 秒后本页会自动重连', 'ok');
          setTimeout(() => window.location.reload(), 2500);
        })
        .catch((e) => toastErr(e, '接管失败'));
      break;
    }
    case 'goto-packs': {
      // 空状态里的"去扩展包页"：关掉抽屉再切视图，否则抽屉会盖住目标页
      const closeBtn = document.querySelector('[data-act="drawer-close"]');
      if (closeBtn) closeBtn.click();
      const nav = document.querySelector('#nav .nav-item[data-view="packs"]');
      if (nav) nav.click();
      break;
    }
    case 'pack-usage': {
      api('GET', `/api/v1/packs/${encodeURIComponent(node.dataset.id)}/usage`)
        .then((d) => {
          const rows = (d && (d.profiles || d.items)) || [];
          const name = node.dataset.name || node.dataset.id;
          if (!rows.length) { toast(`「${name}」目前没有任何环境在用`, 'ok'); return; }
          // **不用原生 alert**（会阻塞、样式不统一，项目里已有自定义弹层）
          const list = rows.map((x) => `· ${x.name}${x.running ? '（运行中）' : ''}`).join('\n');
          showUsageDialog(`「${name}」被 ${rows.length} 个环境用着`, list);
        })
        .catch((e) => toastErr(e, '查询失败'));
      break;
    }
    case 'pack-del': {
      const pkId = node.dataset.id;
      // 先查占用，把"会影响谁"摆在确认框里 —— 以前直接删，用户根本不知道
      // 这个包被哪些环境用着，删完才发现新建环境带不上插件了。
      api('GET', `/api/v1/packs/${encodeURIComponent(pkId)}/usage`).then((d) => {
        const users = (d && (d.profiles || d.items)) || [];
        const extra = users.length
          ? `<p class="mt2">还有 <b>${users.length}</b> 个环境在用：`
            + users.slice(0, 6).map((x) => `<br><span class="mono">· ${esc(x.name)}</span>`).join('')
            + (users.length > 6 ? `<br><span class="muted">…等 ${users.length} 个</span>` : '')
            + `</p><p class="mt2 faint">正在运行的不受影响（插件文件已在扩展库里），但以后新建环境就带不上了。</p>`
          : '';
        confirmDanger({
          title: '删除扩展包', tone: 'bad',
          body: '删除后不能恢复；已经绑定了它的环境会保留现有文件。' + extra,
          confirmText: 'DELETE', okLabel: users.length ? '仍然删除' : '删除',
          async action() {
            // 有环境在用就带 force，让后端知道这是用户明确确认过的
            await api('DELETE', `/api/v1/packs/${encodeURIComponent(pkId)}${users.length ? '?force=1' : ''}`);
            toast('已删除扩展包', 'ok');
            await loadPacks(true); render();
          },
        });
      }).catch(() => {
        // 查占用失败也别把删包这条路堵死
        confirmDanger({
          title: '删除扩展包', tone: 'bad',
          body: '删除后不能恢复；已经绑定了它的环境会保留现有文件。',
          confirmText: 'DELETE', okLabel: '删除',
          async action() {
            await api('DELETE', `/api/v1/packs/${encodeURIComponent(pkId)}`);
            toast('已删除扩展包', 'ok');
            await loadPacks(true); render();
          },
        });
      });
      break;
    }
    case 'ext-unbind': {
      const pid = node.dataset.pid, slug = node.dataset.slug;
      api('POST', `/api/v1/profiles/${encodeURIComponent(pid)}/extensions/remove`, { slugs: [slug] })
        .then(() => { toast(`已移除 ${slug}（运行中的环境需重启才生效）`, 'ok'); render(); })
        .catch((e) => toastErr(e, '移除失败'));
      break;
    }
    case 'ext-bind': openExtBind(node.dataset.slug, node.dataset.ver); break;
    case 'ext-del': {
      const slug = node.dataset.slug, ver = node.dataset.ver;
      confirmDanger({
        title: `删除扩展 ${slug}`, tone: 'bad',
        body: `会从中央库里删掉 <span class="mono">${esc(slug)} ${esc(ver)}</span>。如果还有环境绑定它，后端会返回 <span class="mono">409 EXTENSION_IN_USE</span>，先去解绑。`,
        confirmText: 'DELETE', okLabel: '删除',
        async action() {
          await api('DELETE', `/api/v1/extensions/${encodeURIComponent(slug)}/${encodeURIComponent(ver)}`);
          toast('已删除', 'ok');
          await loadExtensions(true);
          renderView({ soft: true });
        },
      });
      break;
    }

    case 'proxy-new': { const f = proxyForm(null); openDialog(Object.assign({ wide: true }, f)); break; }
    case 'proxy-import': { proxyImportDialog(); break; }
    case 'proxy-edit': {
      const x = ((S.proxies || {}).proxies || []).find((p) => p.id === id);
      if (x) { const f = proxyForm(x); openDialog(Object.assign({ wide: true }, f)); }
      break;
    }
    case 'proxy-del': {
      const x = ((S.proxies || {}).proxies || []).find((p) => p.id === id) || {};
      confirmDanger({
        title: `删除代理 ${x.label || ''}`, tone: 'bad',
        body: `会从代理库移除这条记录。如果还有环境引用（<span class="mono">proxy_id</span>），后端会返回 <span class="mono">409 PROXY_IN_USE</span>。`,
        confirmText: 'DELETE', okLabel: '删除',
        async action() {
          await api('DELETE', `/api/v1/proxies/${encodeURIComponent(id)}`);
          toast('已删除', 'ok');
          await loadProxies(true);
          renderView({ soft: true });
        },
      });
      break;
    }
    case 'proxy-check': {
      (async () => {
        node.classList.add('loading');
        try {
          const r = await api('POST', `/api/v1/proxies/${encodeURIComponent(id)}/check`);
          toast(r.ok ? `出口 ${r.exit_ip || '—'}（${r.latency_ms ?? '—'} ms）` : '出口检测失败', r.ok ? 'ok' : 'err',
            { detail: r.error || '', hint: r.country ? `国家 ${r.country}` : '' });
          await loadProxies(true);
          renderView({ soft: true });
        } catch (e) {
          if (e.todo) toast('代理检测待后端就绪', 'pending', { code: e.code });
          else toastErr(e, '检测失败');
        } finally { node.classList.remove('loading'); }
      })();
      break;
    }
    case 'proxy-check-inline': {
      (async () => {
        const v = (s) => ($(s) || {}).value || '';
        const host = v('#px-host').trim();
        const out = $('#px-inline-result');
        if (!host) { toast('填 host:port', 'err'); return; }
        const [h, pt] = host.includes(':') ? host.split(':') : [host, ''];
        out.innerHTML = '<span class="spin"></span>';
        try {
          const r = await api('POST', '/api/v1/proxies/check', {
            scheme: v('#px-scheme'), host: h, port: Number(pt) || 0,
            username: v('#px-user'), password: v('#px-pass'),
          });
          out.innerHTML = r.ok ? `<span style="color:var(--ok)">出口 ${esc(r.exit_ip || '—')} · ${esc(r.latency_ms ?? '—')} ms</span>`
            : `<span style="color:var(--bad)">失败：${esc(r.error || '未知')}</span>`;
        } catch (e) {
          out.innerHTML = e.todo
            ? '<span class="faint">接口待后端就绪（POST /api/v1/proxies/check）</span>'
            : `<span style="color:var(--bad)">${esc(e.message)}</span>`;
          if (!e.todo) toastErr(e, '检测失败');
        }
      })();
      break;
    }

    case 'sync-push': syncAction('push', id); break;
    case 'sync-pull': syncAction('pull', id); break;
    case 'sync-diff': openSyncDiff(id); break;
    case 'sync-history': openSyncHistory(id); break;
    case 'sync-push-all': pushAll(); break;
    case 'sync-import': importRemote(id); break;
    case 'sync-remote-refresh': loadSync(true).then(() => renderView({ soft: true })); break;
    case 'sync-test': {
      (async () => {
        node.classList.add('loading');
        try {
          // 真正的连通性只有 doctor 会去探 hub；用它的那一项当证据，而不是拿"已配置"冒充"已连通"
          const d = await api('POST', '/api/v1/maintenance/doctor');
          const hit = (d.checks || []).find((c) => String(c['项'] || '').includes('同步'));
          if (!hit) toast('自检里没有同步中心这一项', 'pending');
          else if (hit.ok) toast('同步中心连通', 'ok', { detail: jsonBrief(hit['详情'], 160) });
          else toast('同步中心不通', 'err', { detail: jsonBrief(hit['详情'], 200), hint: '检查 ZW_HUB_URL / ZW_HUB_TOKEN，以及 3.5 上的 zw-hub 容器是否在跑。' });
        } catch (e) { toastErr(e, '连通性检测失败'); }
        finally { node.classList.remove('loading'); }
      })();
      break;
    }
    case 'sync-pull-rev': {
      (async () => {
        const pw = await syncPassword();
        if (!pw) return;
        try {
          const r = await api('POST', `/api/v1/sync/${encodeURIComponent(id)}/pull`,
            { password: pw, revision: Number(node.dataset.rev) || undefined, write_cookies: true, force: true });
          toast(`已拉取 rev ${node.dataset.rev}`, 'ok', { detail: jsonBrief(r, 180) });
          closeDialog();
        } catch (e) { toastErr(e, '拉取指定版本失败'); }
      })();
      break;
    }

    case 'audit-apply': {
      S.audit.action = ($('#a-action') || {}).value || '';
      S.audit.profile = S.auditDraft || '';
      S.audit.page = 0;
      loadAudit().then(() => renderView({ soft: true }));
      break;
    }
    case 'audit-refresh': loadAudit().then(() => renderView({ soft: true })); break;
    case 'audit-page': {
      S.audit.page = Math.max(0, Number(node.dataset.page) || 0);
      loadAudit().then(() => renderView({ soft: true }));
      break;
    }
    case 'audit-detail': auditDetail(id); break;

    case 'token-reenter': showLogin(''); break;
    case 'token-clear': {
      setToken('');
      toast('令牌已清除', 'ok');
      showLogin('已清除本地令牌，请输入新的');
      break;
    }

    case 'cookie-read': dataReadCookies(); break;
    case 'cookie-import': openCookieImport(); break;
    case 'cookie-export': exportCookies(node.dataset.fmt); break;
    case 'cookie-clear': {
      confirmDanger({
        title: '清空 cookie', tone: 'bad',
        body: `当前环境（<span class="mono">${esc((S.profiles.find((p) => p.id === S.data.profile) || {}).name || '')}</span>）的全部 cookie 会被清除。`,
        confirmText: 'CLEAR', okLabel: '清空',
        async action() {
          try {
            await api('POST', `/api/v1/profiles/${encodeURIComponent(S.data.profile)}/cookies/clear`, { start_if_needed: true });
            toast('已清空', 'ok');
            S.data.cookies = [];
            renderView({ soft: true });
          } catch (e) {
            if (e.todo) toast('清空 cookie 待后端就绪', 'pending', { code: e.code });
            else throw e;
          }
        },
      });
      break;
    }
    case 'storage-read': storageRead(); break;
    case 'storage-write': openStorageWrite(); break;
    case 'page-nav': pageAction('nav'); break;
    case 'page-shot': pageAction('shot'); break;
    case 'page-text': pageAction('text'); break;
    case 'page-eval': pageAction('eval'); break;
    case 'page-targets': pageAction('targets'); break;
    case 'target-switch': {
      // 切标签 = 把管理页指向那个 url，比开新标签更贴近"我现在想看这个"
      const t = (S.data.targets || []).find((x) => x.targetId === node.dataset.tid);
      if (t && t.url && !t.url.startsWith('about:')) {
        const u = $('#d-url'); if (u) u.value = t.url;
        toast('已填入地址，点「导航」切换到该页', 'ok', { detail: t.title || '' });
      } else { toast('这个标签没有可导航的地址', 'pending'); }
      break;
    }
    case 'target-close': {
      // 关标签走网关的 /json/close/{targetId}，需要 CDP 令牌；先取一次再关。
      (async () => {
        const tid = node.dataset.tid;
        const turl = node.dataset.turl || '';
        // 关掉 about:blank / 我们自己的管理页会让后续断言失败，先拦一下
        if (!turl || turl.startsWith('about:')) { toast('这个标签没有真实页面，跳过', 'pending'); return; }
        try {
          const info = await api('GET', `/api/v1/profiles/${encodeURIComponent(S.data.profile)}/cdp`);
          const resp = await fetch(`/cdp/${encodeURIComponent(S.data.profile)}/json/close/${encodeURIComponent(tid)}?token=${encodeURIComponent(info.token)}`);
          const text = await resp.text();
          if (!resp.ok) throw new ZwError('CLOSE_FAILED', `关闭失败：HTTP ${resp.status}`, trunc(text, 200), resp.status);
          toast('标签已关闭', 'ok');
          await pageAction('targets');
        } catch (e) { toastErr(e, '关闭标签失败'); }
      })();
      break;
    }
    case 'shot-full': showShotFull(); break;
    case 'log-tab': {
      $$('#log-tabs .tab').forEach((b) => b.classList.toggle('active', b === node));
      // 用抽屉打开时记下的 id，而不是从标题反查名字（名字可重复，反查会张冠李戴）
      loadProfileLogs(S.detailId, node.dataset.tab, false);
      break;
    }
    case 'reload-logs': {
      const cur = $('#log-tabs .tab.active');
      loadProfileLogs(id, cur ? cur.dataset.tab : 'browser', false);
      break;
    }
    default: break;
  }
}

function openProfileMore(anchor, id) {
  const p = S.profiles.find((x) => x.id === id) || {};
  const items = [
    { title: '生命周期' },
    { act: 'start', label: '启动', disabled: p.state === 'running', run: () => profileAction(id, 'start') },
    { act: 'stop', label: '停止', disabled: p.state !== 'running', run: () => profileAction(id, 'stop') },
    { act: 'restart', label: '重启', run: () => profileAction(id, 'restart') },
    { act: 'unlock', label: '强制释放租约', run: () => profileAction(id, 'unlock') },
    '-',
    { title: '数据与指纹' },
    { act: 'detail', label: '查看详情', run: () => openProfileDetail(id) },
    { act: 'edit', label: '编辑字段', run: () => openProfileForm(p) },
    { act: 'probe', label: '指纹体检', run: () => openProbeDialog(id) },
    { act: 'cookie-clear', label: '清空 cookie', run: () => clearCookiesOne(id) },
    { act: 'reset-fp', label: '重置指纹', danger: true, run: () => resetFingerprint(id) },
    '-',
    { act: 'export', label: '导出 .zwp', run: () => exportProfile(id) },
    { act: 'delete', label: '删除环境', danger: true, run: () => deleteOne(id) },
  ];
  openMenu(anchor, items);
}

/* ── 装箱 ─────────────────────────────────────────────────────────────────── */
document.addEventListener('click', (ev) => {
  // 菜单开着时点别处先关菜单
  if (menuEl && !menuEl.contains(ev.target) && !ev.target.closest('[data-act="more"]')) closeMenu();
  const node = ev.target.closest('[data-act]');
  if (!node) return;
  if (node.tagName === 'A') return;                       // 下载链接交给浏览器
  // 复选框 / 单选框的 data-act 由 change 事件接手；在这里 preventDefault 会把勾选本身取消掉
  if (/^(INPUT|LABEL|SELECT|OPTION)$/.test(node.tagName)) return;
  ev.preventDefault();
  try { onAct(node.dataset.act, node, ev); }
  catch (e) { toastErr(e, '操作出错'); console.error(e); }
});

/* 输入类：搜索防抖 300ms，避免每敲一个字打一次请求 */
const onSearch = debounce(() => { renderView({ soft: true }); }, 300);
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'f-q') { S.filters.q = t.value; renderView({ soft: true }); return; }
  if (t.id === 'd-cookie-q') { S.data.cookieQ = t.value; onSearch(); return; }
  if (t.id === 'd-expr') { S.data.expr = t.value; return; }
  // 这几项都要立刻进状态：8 秒轮询会整块重画，不记下来就等于"打一半字被清空"
  if (t.id === 'd-url') { S.data.url = t.value; return; }
  if (t.id === 'd-origins') { S.data.origins = t.value; return; }
  if (t.id === 'sync-pw') { S.syncPw = t.value; return; }
  if (t.id === 'a-profile') { S.auditDraft = t.value; return; }
  if (t.classList && t.classList.contains('invalid')) t.closest('.field').classList.remove('invalid');
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'f-state') { S.filters.state = t.value; renderView({ soft: true }); }
  else if (t.id === 'filter-group') { S.filters.group = t.value; renderView({ soft: true }); }
  else if (t.id === 'ck-all') {
    const rows = visibleProfiles();
    if (t.checked) rows.forEach((p) => S.sel.add(p.id));
    else rows.forEach((p) => S.sel.delete(p.id));
    renderView({ soft: true });
  } else if (t.dataset && t.dataset.act === 'row-check') {
    if (t.checked) S.sel.add(t.dataset.id); else S.sel.delete(t.dataset.id);
    renderView({ soft: true });
  } else if (t.id === 'd-profile') {
    S.data.profile = t.value;
    S.data.cookies = []; S.data.storage = null; S.data.targets = null;
    S.data.shot = ''; S.data.text = ''; S.data.evalResult = null;
    renderView({ soft: true });
  } else if (t.id === 'd-start') { S.data.startIfNeeded = t.checked; }
  else if (t.id === 'd-newtab') { S.data.newTab = t.checked; }
  else if (t.id === 'a-action') { /* 用「筛选」按钮触发，避免每改一次就查一次 */ }
  else if (t.id === 'sync-remember') {
    const pw = ($('#sync-pw') || {}).value || '';
    if (t.checked && pw) localStorage.setItem('zw_sync_pw', pw);
    if (!t.checked) localStorage.removeItem('zw_sync_pw');
  }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.id === 'a-profile') { ev.preventDefault(); onAct('audit-apply', ev.target); }
  if (ev.key === 'Escape') { closeMenu(); if ($('#drawer').classList.contains('open')) closeDrawer(); }
  // ⌘K / Ctrl+K 聚焦搜索框，键盘党常用
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') {
    const q = $('#f-q');
    if (q) { ev.preventDefault(); q.focus(); q.select(); }
  }
});

/* ============================================================================
   21 · 启动
   ========================================================================== */
async function boot() {
  // 登录卡提交
  const doLogin = async () => {
    const v = $('#login-input').value.trim();
    if (!v) { $('#login-err').textContent = '令牌不能为空'; return; }
    setToken(v);
    $('#login-err').textContent = '';
    const okd = await loadMeta();
    if (okd) { hideLogin(); await startData(); }
    else { setToken(''); showLogin('令牌被拒绝，再试一次'); }
  };
  // 用 form 的 submit 而不是按钮 click：Enter 提交、浏览器密码管理器提示都由浏览器接管
  $('#login-form').addEventListener('submit', (ev) => { ev.preventDefault(); doLogin(); });

  $('#btn-refresh').addEventListener('click', () => refreshView({ force: true }));
  $('#btn-quick-new').addEventListener('click', () => openProfileForm(null));
  $('#btn-autorefresh').addEventListener('click', () => {
    S.autorefresh = !S.autorefresh;
    $('#btn-autorefresh').textContent = '自动刷新 · ' + (S.autorefresh ? '开' : '关');
    toast(S.autorefresh ? '自动刷新已开启（8 秒）' : '自动刷新已关闭', 'ok');
  });
  $('#drawer-x').addEventListener('click', closeDrawer);
  $('#scrim').addEventListener('click', closeDrawer);
  $('#dlg-x').addEventListener('click', closeDialog);

  $$('#nav .nav-item').forEach((b) => b.addEventListener('click', () => switchView(b.dataset.view)));
  window.addEventListener('hashchange', () => {
    const v = (location.hash || '').replace(/^#\/?/, '') || 'overview';
    if (v !== S.view) switchView(v);
  });
  window.addEventListener('resize', closeMenu);
  window.addEventListener('scroll', closeMenu, true);

  const savedView = (location.hash || '').replace(/^#\/?/, '');
  S.view = VIEW_META[savedView] ? savedView : 'overview';

  // 本地没有令牌时先问一次 meta，再决定要不要弹登录卡。
  //
  // ## 这里以前是直接 showLogin，用户抱怨的正是这个
  //
  // 用户原话：「客户端打开控制台的话，就再也不需要输入什么访问令牌，
  // 直接就可以进入」。而早先的代码是 `if (!S.token) { showLogin(); return; }`
  // —— 不看服务端到底要不要令牌，本地没存过令牌就无条件弹框。
  // 结果就是：即使 core 在回环上已经放行（`auth_required: false`），
  // 打开页面仍然被要求输令牌，看起来那个改动完全没生效。
  //
  // 现在的顺序：先 loadMeta()
  //   - `auth_required === false`（本机回环 / 没配令牌）→ 直接进，不弹框
  //   - 否则才弹登录卡
  // loadMeta 失败（服务没起来）也弹卡，那里至少能看错误提示。
  if (!S.token) {
    const okMeta = await loadMeta();
    if (S.meta && S.meta.auth_required === false) {
      hideLogin();
      await startData();
      return;
    }
    showLogin('');
    renderView();
    return;
  }
  const okMeta = await loadMeta();
  if (!okMeta && !S.meta) {
    showLogin('');
    renderView();
    return;
  }
  await startData();
}

async function startData() {
  S.booted = false;
  $('#view').innerHTML = skeletonView();
  await Promise.all([loadStats(), loadProfiles(), loadEvents(), loadSync(), loadGroups(), loadProxies(), loadExtensions(), loadAudit()]);
  S.booted = true;
  renderView();
  startPolling();
}

let pollTimer = null;
function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => {
    // 页面不可见时不拉数据：内网里同时开几个控制台会把 core 拖慢
    if (document.hidden || !S.autorefresh || !S.booted) return;
    // 抽屉/弹窗/登录卡开着时也不刷新列表，免得用户正在看的内容被换掉
    if ($('#dlg').open || $('#drawer').classList.contains('open') || $('#login').classList.contains('show')) return;
    refreshView({ quiet: true }).catch(() => {});
  }, 8000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.booted) refreshView({ quiet: true }).catch(() => {});
});

boot().catch((e) => {
  console.error(e);
  $('#view').innerHTML = `<div class="view-inner"><div class="notice bad"><span class="nic">⛔</span>
    <div><b>控制台启动失败</b><div class="mono fs11 mt1">${esc(e && e.message)}</div>
    <div class="fs11 mt1">先确认 core 在跑：<span class="mono">bash scripts/run-dev.sh</span>，再刷新本页。</div></div></div></div>`;
});
</script>
