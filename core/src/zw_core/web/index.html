/* 填「插件」勾选列表。
   **必须在"打开表单"时调一次，不能放在 collectProfileForm 里** ——
   后者每次提交都会跑，会把用户勾好的 checkbox 用 is_default 重新渲染，
   手选结果被冲掉（看起来像"界面不记我的选择"）。
   而且异步 .then 晚于同步读取，首次提交时 DOM 还是空的，picked 恒为 []。 */
function fillPackPicker(){
  const box = $('#f-pack-list');
  if (!box) return;
  api('GET', '/api/v1/packs').then((d) => {
    const packs = (d && (d.packs || d.items)) || [];
    if (!packs.length) {
      // 空的时候**不能只留一片空白**：用户会以为"这功能不存在"或"界面坏了"，
      // 也找不到去哪里补包。给一句能动手的话 + 一个直达按钮。
      box.innerHTML = '<div class="pending-note"><span>◷</span>还没有扩展包。先去「扩展包」页导入'
        + '（或从控制台拉取），之后新建环境就能在这里勾选要带哪些插件。'
        + '<button class="btn xs ghost" data-act="goto-packs" style="margin-left:6px">去扩展包页</button></div>';
      return;
    }
    box.innerHTML = packs.map(p =>
      `<label class="switch"><input type="checkbox" value="${escAttr(p.id)}" ${p.is_default ? 'checked' : ''}> ` +
      `${esc(p.name)} <span class="muted">（${p.extension_count || 0} 个扩展${p.with_data ? '，带数据' : ''}）</span></label>`
    ).join('');
  }).catch(() => { box.innerHTML = '<span class="muted">读取扩展包失败</span>'; });
}

function collectProfileForm() {
  const v = (id) => { const n = $('#' + id); return n ? n.value.trim() : ''; };
  const b = (id) => { const n = $('#' + id); return !!(n && n.checked); };
  const num = (id) => { const s = v(id); return s === '' ? null : Number(s); };
  const payload = {
    name: v('f-name'),
    group_name: v('f-group'),
    tags: v('f-tags') ? v('f-tags').split(',').map((x) => x.trim()).filter(Boolean) : [],
    note: v('f-note'),
    fp_platform: v('f-fp_platform') || 'host',
    fp_platform_version: v('f-fp_platform_version'),
    fp_brand: v('f-fp_brand'),
    fp_brand_version: v('f-fp_brand_version'),
    fp_hardware: num('f-fp_hardware'),
    fp_timezone: v('f-fp_timezone'),
    fp_lang: v('f-fp_lang'),
    fp_accept_lang: v('f-fp_accept_lang'),
    fp_disable_spoofing: v('f-fp_disable_spoofing'),
    fp_ua: v('f-fp_ua'),
    proxy: v('f-proxy'),
    start_urls: v('f-start_urls').split('\n').map((x) => x.trim()).filter(Boolean),
    window_w: num('f-window_w') || 1280,
    window_h: num('f-window_h') || 800,
    extensions: v('f-extensions') ? v('f-extensions').split(',').map((x) => x.trim()).filter(Boolean) : [],
    restart_policy: v('f-restart_policy') || 'on-failure',
    headless: b('f-headless'),
    ephemeral: b('f-ephemeral'),
    trim_on_stop: b('f-trim_on_stop'),
    sync_enabled: b('f-sync_enabled'),
    cdp_enabled: b('f-cdp_enabled'),
  };
  // 只在**新建**时有这个勾选（改环境时不动已绑定的扩展集合）
  // 填「插件」勾选列表：列出所有扩展包，默认包预勾上
  const wdp = $('#f-with_default_packs');
  if (wdp) payload.with_default_packs = !!wdp.checked;
  // 勾选的包（给了就以它为准，忽略 with_default_packs）
  // **无条件传**：空数组表示"一个都不带"（干净环境）。
  // 以前 `if (picked.length)` —— 空勾选就不传，后端于是按默认包带全套，
  // 与界面文案「一个都不勾 = 干净环境」正好相反。
  const picker = document.querySelector('#f-pack-list');
  if (picker) {
    payload.pack_ids = [...picker.querySelectorAll('input[type=checkbox]:checked')]
      .map(i => i.value).filter(Boolean);
  }
  const pidNode = $('#f-proxy-id');
  if (pidNode && pidNode.value) payload.proxy_id = pidNode.value;
  return payload;
}

async function submitProfileForm(profile) {
  const btn = $('#f-submit');
  const payload = collectProfileForm();
  // 前端先拦一次必填，省掉一次"提交了才报错"的往返
  if (!payload.name) {
    const n = $('#f-name');
    n.closest('.field').classList.add('invalid');
    n.focus();
    toast('名称不能为空', 'err', { hint: '环境名是唯一标识，CLI 与 API 都用它当 ref。' });
    return;
  }
  btn.classList.add('loading');
  try {
    if (profile) {
      // 编辑时把 null 值剔掉：后端只接受白名单字段，null 会被当成"要清空"
      const body = { ...payload };
      if (body.fp_hardware === null) delete body.fp_hardware;
      await api('PATCH', `/api/v1/profiles/${encodeURIComponent(profile.id)}`, body);
      toast(`已保存 ${payload.name}`, 'ok');
    } else {
      const created = await api('POST', '/api/v1/profiles', payload);
      toast(`已创建 ${payload.name}`, 'ok', { detail: `种子 ${created.fp_seed} · id ${created.id}` });
      // **插件没带上时必须让用户看见**（2026-11-20 审查指出）：
      // 后端 `warnings` 字段早就有，但两个前端都没读，等于白加。
      // 典型场景：勾的包 id 拼错、包被删了、包里的扩展缺 manifest。
      if (created.warnings && created.warnings.length) {
        showUsageDialog('环境已创建，但插件没完全带上',
          created.warnings.map((w) => '· ' + w).join('\n')
          + '\n\n环境本身可以正常用，去「环境详情 → 扩展」里可以补装。');
      }
    }
    closeDrawer();
    await refreshView(true);
  } catch (e) {
    toastErr(e, profile ? '保存失败' : '创建失败');
    btn.classList.remove('loading');
  }
}
</script>
<script>
'use strict';
/* ============================================================================
   9 · 环境详情抽屉
   一次性拉单体（含租约），日志按需拉——日志可能有几千行，轮询里拉会把浏览器卡住。
   ========================================================================== */
async function openProfileDetail(idOrName) {
  const p = S.profiles.find((x) => x.id === idOrName || x.name === idOrName);
  const ref = p ? p.id : idOrName;
  S.detailId = ref;
  // 换环境就把上一份体检结果丢掉：把 A 的 webgl_renderer 显示在 B 头上比空着更糟
  if (S.probe && S.probe.profile_id && S.probe.profile_id !== ref) S.probe = null;
  openDrawer({
    title: '环境详情',
    body: `<div class="skel skel-line" style="width:150px;height:16px"></div>
      ${Array.from({ length: 9 }, () => '<div class="skel skel-line"></div>').join('')}`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="drawer-close">关闭</button>`,
    wide: true,
  });
  let full;
  try {
    full = await api('GET', `/api/v1/profiles/${encodeURIComponent(ref)}`);
  } catch (e) {
    openDrawer({
      title: '环境详情',
      body: `<div class="notice bad"><span class="nic">⛔</span><div>${esc(e.message)}${e.hint ? `<div class="faint mt1">${esc(e.hint)}</div>` : ''}</div></div>`,
      footer: `<div class="grow"></div><button class="btn sm" data-act="drawer-close">关闭</button>`,
    });
    return;
  }
  renderProfileDetail(full);
}

function renderProfileDetail(p) {
  const lease = p.lease;
  const rows = [
    ['ID', p.id, true],
    ['状态', stateChip(p.state), false],
    ['引擎', `${esc(p.engine_version || '—')}`, false],
    ['内核路径', p.engine_path, true],
    ['指纹种子', p.fp_seed, true],
    ['平台', p.fp_platform || 'host', false],
    ['品牌', [p.fp_brand, p.fp_brand_version].filter(Boolean).join(' ') || '—', false],
    ['CPU 核数', p.fp_hardware ?? '宿主机', false],
    ['时区 / 语言', [p.fp_timezone, p.fp_lang].filter(Boolean).join(' / ') || '宿主机', false],
    ['禁用伪装', p.fp_disable_spoofing || '—', true],
    // 「代理」列：绑的是代理库（proxy_id）时 `p.proxy` 是空的（库是唯一真相，
    // `assign_to_profile` 有意置空），必须读 `proxy_info` 才知道实际用哪个 ——
    // 否则会把"在用代理"显示成「直连」，与事实相反。
    ['代理', (() => {
      const pi = p.proxy_info || {};
      if (pi.source === 'library') return pi.upstream || '代理库';
      if (pi.source === 'missing') return '库条目已删除';
      return p.proxy || '直连';
    })(), true],
    ['起始网址', (p.start_urls || []).length ? p.start_urls.join('\n') : '—', true],
    ['窗口', `${p.window_w}×${p.window_h}${p.headless ? ' · headless' : ''}`, false],
    ['扩展', (p.extensions || []).length
      ? (p.extensions || []).map(x => `<span class="mono">${esc(String(x))}</span>`
          + ` <button class="btn xs ghost" data-act="ext-unbind" data-pid="${escAttr(p.id)}" data-slug="${escAttr(String(x))}">移除</button>`).join('<br>')
      : '—（点上面的「应用包」给它装）', true],
    ['重启策略', p.restart_policy || '—', false],
    ['同步', `${p.sync_state || '—'} · rev ${p.sync_revision || 0}${p.sync_key_fp ? ' · fp ' + p.sync_key_fp : ''}`, true],
    ['端口 / PID', `${p.cdp_port || '—'} / ${p.pid || '—'}`, true],
    ['创建', fmtTime(p.created_at, true), false],
    ['最近启动', fmtTime(p.last_start_at, true), false],
    ['最近停止', p.last_stop_at ? fmtTime(p.last_stop_at, true) : '—', false],
  ];

  const leaseHtml = lease
    ? `<div class="kv">
        <span class="kv-k">持有者</span><span class="kv-v mono">${esc(lease.owner || '—')}</span>
        <span class="kv-k">类型</span><span class="kv-v">${esc(lease.kind || '—')}${lease.is_mine ? ' · 本机' : ' · 他机'}</span>
        <span class="kv-k">剩余</span><span class="kv-v mono">${esc(lease.remain_seconds ?? '—')} 秒</span>
        <span class="kv-k">存活</span><span class="kv-v">${lease.alive ? '<span class="st running"><i class="dot running"></i>有效</span>' : '<span class="st stopped"><i class="dot stopped"></i>已失效</span>'}</span>
      </div>`
    : `<div class="faint fs12">当前没有租约。租约只在运行期间存在，防止两个地方同时开同一个环境。</div>`;

  const body = `
    <div class="card-h" style="margin-bottom:12px">
      <div style="min-width:0">
        <div class="fs15" style="font-weight:620">${esc(p.name)}</div>
        <div class="faint fs11 mt1">${p.group_name ? esc(p.group_name) + ' · ' : ''}${(p.tags || []).join(' · ') || '无标签'}</div>
      </div>
      <div class="grow"></div>
      ${stateChip(p.state)}
    </div>
    ${p.last_error ? `<div class="notice bad mb3"><span class="nic">⛔</span><div><b>最近错误</b><div class="mono fs11 mt1">${esc(p.last_error)}</div></div></div>` : ''}

    <div class="sect-h">字段</div>
    <div class="kv">${rows.map(([k, v, mono]) => `<span class="kv-k">${esc(k)}</span><span class="kv-v ${mono ? 'mono' : ''}" style="${String(v).includes('\n') ? 'white-space:pre-wrap' : ''}">${typeof v === 'string' && v.startsWith('<span') ? v : esc(v)}</span>`).join('')}</div>

    <div class="sect-h">租约</div>
    ${leaseHtml}

    <div class="sect-h">指纹体检</div>
    <div class="row mb3">
      <span class="faint fs11">读真机上实际生效的值，判断各特征是否自洽</span>
      <div class="grow"></div>
      <button class="btn xs" data-act="probe-inline" data-id="${escAttr(p.id)}">运行体检</button>
    </div>
    <div id="probe-box">${S.probe ? probeResultHtml(S.probe) : '<div class="faint fs12">还没跑。点「运行体检」会打开一个专属管理标签页采样，约 1–3 秒。</div>'}</div>

    <div class="sect-h">日志</div>
    <div class="row mb3">
      <div class="tabs" id="log-tabs">
        <button class="tab active" data-act="log-tab" data-tab="browser">browser</button>
        <button class="tab" data-act="log-tab" data-tab="profile">profile</button>
      </div>
      <div class="grow"></div>
      <button class="btn xs" data-act="reload-logs" data-id="${escAttr(p.id)}">重新读取</button>
    </div>
    <pre class="codeblock" id="log-box" style="max-height:300px">读取中…</pre>
  `;

  const actions = [
    p.state === 'running'
      ? `<button class="btn sm" data-act="stop" data-id="${escAttr(p.id)}">停止</button>`
      : `<button class="btn sm primary" data-act="start" data-id="${escAttr(p.id)}">启动</button>`,
    `<button class="btn sm" data-act="restart" data-id="${escAttr(p.id)}">重启</button>`,
    p.state === 'running' ? `<button class="btn sm" data-act="cdp" data-id="${escAttr(p.id)}">取 CDP</button>` : '',
    // 注意：这里不再放「指纹体检」按钮 —— 抽屉正文里已经有一整块「指纹体检」面板
    // （含"运行体检"按钮与结果区），底部再放一个同名按钮会让人不知道该点哪个。
    // 列表行内「更多」菜单里的那一项走 openProbeDialog（弹窗形态），是给不打开抽屉时用的。
    `<div class="grow"></div>`,
    `<button class="btn sm ghost" data-act="edit-profile" data-id="${escAttr(p.id)}">编辑</button>`,
    `<button class="btn sm ghost" data-act="unlock" data-id="${escAttr(p.id)}">强制释放租约</button>`,
  ].join('');

  openDrawer({ title: `详情 · ${p.name}`, body, footer: actions, wide: true });
  // 日志是二次请求：先让骨架落屏，再填内容，避免点开抽屉时白等
  loadProfileLogs(p.id, 'browser', true);
}

/**
 * 体检结果的渲染。warnings 是唯一"会告诉你哪儿不对"的字段，所以它要显眼；
 * 其余指标走 kv 表逐项对照。null 值必须显式写 null——"取不到"和"取到空"是两件事，
 * 前者往往意味着该特征根本没被注入（例如无 GPU 机器上的 webgl）。
 */
function probeResultHtml(d) {
  const warns = d.warnings || [];
  const cell = (v) => (v === null || v === undefined
    ? '<span class="muted">null</span>'
    : esc(typeof v === 'object' ? jsonBrief(v, 220) : v));
  const rows = [
    ['ua', cell(d.ua)],
    ['platform', cell(d.platform)],
    ['timezone', `${cell(d.timezone)}${d.timezone_offset !== null && d.timezone_offset !== undefined ? ` <span class="faint">(${esc(d.timezone_offset)} 分)</span>` : ''}`],
    ['webgl_renderer', cell(d.webgl_renderer)],
    ['canvas_hash', cell(d.canvas_hash)],
    ['fonts_count', cell(d.fonts_count)],
    ['webdriver', d.webdriver === null || d.webdriver === undefined
      ? '<span class="muted">null</span>'
      : (d.webdriver ? '<span class="badge bad">true</span>' : '<span class="badge ok">false</span>')],
  ];
  return `${warns.length
    ? `<div class="notice bad mb3"><span class="nic">⚠</span><div>
        <b>发现 ${warns.length} 条可疑项</b>
        <ul style="margin:6px 0 0;padding-left:17px;line-height:1.75">${warns.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>
      </div></div>`
    : `<div class="notice info mb3"><span class="nic">✓</span><div>没有检测到明显矛盾项。注意这不能替代 browserscan / creepjs 的第三方评分。</div></div>`}
    <div class="kv">${rows.map(([k, v]) => `<span class="kv-k mono">${esc(k)}</span><span class="kv-v mono" style="word-break:break-all">${v}</span>`).join('')}</div>`;
}

async function loadProbeInline(id) {
  const box = $('#probe-box');
  if (!box) return;
  box.innerHTML = `<div class="row"><span class="spin"></span><span class="faint fs12">正在采样（会复用专属管理标签页，不动你正在看的页面）…</span></div>`;
  try {
    const d = await api('POST', `/api/v1/profiles/${encodeURIComponent(id)}/fingerprint/probe?start_if_needed=true`, {});
    S.probe = d;   // 存起来，抽屉被轮询/重画时结果不会丢
    const now = $('#probe-box');
    if (now && now.isConnected) now.innerHTML = probeResultHtml(d);
    const w = (d.warnings || []).length;
    if (w) toast(`体检发现 ${w} 条可疑项`, 'pending', { hint: '下面「指纹体检」一栏里逐条列出了矛盾项。' });
    else toast('体检未发现明显矛盾', 'ok');
  } catch (e) {
    const now = $('#probe-box');
    if (now && now.isConnected) {
      now.innerHTML = `<div class="notice bad"><span class="nic">⛔</span><div><b>${esc(e.message)}</b>
        ${e.hint ? `<div class="fs11 mt1">${esc(e.hint)}</div>` : ''}</div></div>`;
    }
    toastErr(e, '指纹体检失败');
  }
}

async function loadProfileLogs(id, which, silent) {
  const box = $('#log-box');
  if (!box) return;
  if (!silent) box.textContent = '读取中…';
  try {
    const d = await api('GET', `/api/v1/profiles/${encodeURIComponent(id)}/logs?tail=200`);
    const lines = d[which] || [];
    box.textContent = lines.length ? lines.join('\n') : `（${which}.log 是空的）`;
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    box.textContent = `读取日志失败：${e.message}${e.hint ? '\n' + e.hint : ''}`;
  }
}

/* ============================================================================
   10 · CDP 弹窗
   令牌有 TTL，所以弹窗里必须做倒计时——否则用户复制走一段代码、十分钟后跑起来
   才发现 401，会以为是自己环境的问题。
   ========================================================================== */
async function openCdpDialog(idOrName) {
  openDialog({
    title: 'CDP 连接',
    sub: '把地址交给 Playwright / Puppeteer 的 connectOverCDP',
    body: `<div class="row"><span class="spin"></span><span class="faint fs12">正在签发令牌…</span></div>`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">关闭</button>`,
    wide: true,
  });
  let info;
  try {
    info = await api('GET', `/api/v1/profiles/${encodeURIComponent(idOrName)}/cdp`);
  } catch (e) {
    openDialog({
      title: 'CDP 连接',
      sub: '签发失败',
      body: `<div class="notice ${e.todo ? '' : 'bad'}"><span class="nic">${e.todo ? '◷' : '⛔'}</span><div>
        <b>${esc(e.message)}</b>
        ${e.hint ? `<div class="fs11 mt1">${esc(e.hint)}</div>` : ''}
        ${e.code === 'STATE_CONFLICT' ? '<div class="fs11 mt2">环境没在运行时不签发地址：调试端口根本不存在。</div>' : ''}
      </div></div>`,
      footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">关闭</button>`,
    });
    return;
  }
  const expiresAt = Date.now() / 1000 + (info.token_ttl || 0);
  const block = (label, text) => `<div class="field mb3">
      <label>${esc(label)} <button class="btn xs ghost" data-act="copy" data-copy="${escAttr(text)}" style="margin-left:auto">复制</button></label>
      <pre class="codeblock">${esc(text)}</pre>
    </div>`;
  const body = `
    <div class="row mb3">
      <span class="badge mono">token</span>
      <span class="mono ellip" style="flex:1;min-width:0">${esc(info.token)}</span>
      <span class="badge warn"><span id="cdp-ttl">${esc(info.token_ttl)}</span> 秒后过期</span>
    </div>
    ${block('Playwright', info.playwright || '')}
    ${block('Puppeteer', info.puppeteer || '')}
    ${block('原始发现接口（curl 这个能看到真实地址）', info.raw_cdp_json || '')}
    ${block('网关 WS 主通道', info.gateway_ws_url || '')}
    <div class="kv">
      <span class="kv-k">本地端口</span><span class="kv-v mono">${esc(info.local_port || '—')}</span>
      <span class="kv-k">网关入口</span><span class="kv-v mono">${esc(info.gateway_http_endpoint || '—')}</span>
    </div>
    ${info.hint ? `<div class="notice info mt3"><span class="nic">ⓘ</span><div>${esc(info.hint)}</div></div>` : ''}
  `;
  openDialog({
    title: 'CDP 连接',
    sub: `令牌 ${info.token_ttl} 秒有效 · 浏览器本身只听 127.0.0.1，对外只经网关`,
    body,
    footer: `<div class="grow"></div>
      <button class="btn sm" data-act="copy" data-copy="${escAttr(info.gateway_http_endpoint || '')}">复制入口</button>
      <button class="btn sm primary" data-act="dlg-close">知道了</button>`,
    wide: true,
  });
  // 倒计时；弹窗关掉就自己停，避免残留定时器在后台空转
  const ttlEl = $('#cdp-ttl');
  const timer = setInterval(() => {
    if (!ttlEl || !ttlEl.isConnected) { clearInterval(timer); return; }
    const left = Math.round(expiresAt - Date.now() / 1000);
    ttlEl.textContent = left > 0 ? String(left) : '0';
    if (left <= 0) {
      ttlEl.parentElement.className = 'badge bad';
      ttlEl.parentElement.innerHTML = '令牌已过期，重新打开本弹窗';
      clearInterval(timer);
    }
  }, 1000);
}

/* ============================================================================
   11 · 指纹体检
   ========================================================================== */
async function openProbeDialog(id) {
  openDialog({
    title: '指纹体检',
    sub: '读真机上实际生效的值，判断各特征是否自洽',
    body: `<div class="row"><span class="spin"></span><span class="faint fs12">正在读取（会复用专属管理标签页）…</span></div>`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">关闭</button>`,
    wide: true,
  });
  let d;
  try {
    // 契约写的是 POST + 空 body；当前实现把 start_if_needed 放在 query 上、不读 body。
    // 发空 JSON body 同时带 query，两种实现都能接住。
    d = await api('POST', `/api/v1/profiles/${encodeURIComponent(id)}/fingerprint/probe?start_if_needed=true`, {});
  } catch (e) {
    openDialog({
      title: '指纹体检',
      sub: e.todo ? '接口待后端就绪' : '读取失败',
      body: `<div class="notice ${e.todo ? '' : 'bad'}"><span class="nic">${e.todo ? '◷' : '⛔'}</span><div>
        <b>${esc(e.message)}</b>${e.hint ? `<div class="fs11 mt1">${esc(e.hint)}</div>` : ''}</div></div>
        ${e.todo ? '<div class="fs11 faint mt3">契约里定义了 <span class="mono">POST /api/v1/profiles/{ref}/fingerprint/probe</span>，后端补上后这里会自动可用。</div>' : ''}`,
      footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">关闭</button>`,
    });
    return;
  }
  const g = (k) => (d[k] === null || d[k] === undefined ? '<span class="muted">null</span>' : esc(typeof d[k] === 'object' ? jsonBrief(d[k], 200) : d[k]));
  const rows = [
    ['UA', g('ua')], ['platform', g('platform')], ['vendor', g('vendor')],
    ['ua_data', g('ua_data')], ['timezone', `${g('timezone')} <span class="faint">(${esc(d.timezone_offset ?? '—')} 分)</span>`],
    ['languages', g('languages')], ['lang', g('lang')],
    ['hardware_concurrency', g('hardware_concurrency')], ['device_memory', g('device_memory')],
    ['webgl_vendor', g('webgl_vendor')], ['webgl_renderer', g('webgl_renderer')],
    ['canvas_hash', g('canvas_hash')], ['audio_hash', g('audio_hash')],
    ['webdriver', d.webdriver === null ? '<span class="muted">null</span>' : (d.webdriver ? '<span class="badge bad">true</span>' : '<span class="badge ok">false</span>')],
    ['screen', `${esc(d.screen ? `${d.screen.width}×${d.screen.height} @${d.screen.colorDepth}bit` : 'null')}`],
    ['fonts_count', g('fonts_count')],
  ];
  const warns = d.warnings || [];
  openDialog({
    title: '指纹体检',
    sub: `${esc(d.name || '')} · 状态 ${esc(d.state || '—')}`,
    body: `${warns.length ? `<div class="notice mb3"><span class="nic">⚠</span><div><b>发现 ${warns.length} 条可疑项</b><ul style="margin:6px 0 0;padding-left:17px">${warns.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div></div>`
      : `<div class="notice info mb3"><span class="nic">✓</span><div>没有检测到明显矛盾项。注意这不能替代 browserscan / creepjs 的真实评分。</div></div>`}
      <div class="kv">${rows.map(([k, v]) => `<span class="kv-k mono">${esc(k)}</span><span class="kv-v mono" style="word-break:break-all">${v}</span>`).join('')}</div>`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="copy" data-copy="${escAttr(jsonPretty(d))}">复制 JSON</button><button class="btn sm primary" data-act="dlg-close">关闭</button>`,
    wide: true,
  });
}

/* ============================================================================
   12 · 视图：数据（cookie / localStorage / 页面）
   ========================================================================== */
function dataProfileOptions() {
  return S.profiles.map((p) => `<option value="${escAttr(p.id)}" ${S.data.profile === p.id ? 'selected' : ''}>${esc(p.name)}${p.state === 'running' ? '' : '（未运行）'}</option>`).join('');
}

function renderData() {
  const d = S.data;
  if (!S.profiles.length) {
    return `<div class="view-inner view-enter"><div class="glass card"><div class="empty">
      <div class="e-ico">◍</div><b>先建一个环境</b>cookie / localStorage 都是按环境隔离的。</div></div></div>`;
  }
  if (!d.profile) d.profile = S.profiles[0].id;
  const cur = S.profiles.find((p) => p.id === d.profile) || S.profiles[0];
  const runningWarn = cur && cur.state !== 'running'
    ? `<div class="notice mb3"><span class="nic">⚠</span><div>${esc(cur.name)} 当前没在运行。读 cookie 需要调试端口，可以把下面的 <span class="mono">start_if_needed</span> 打开让服务端代你启动。</div></div>` : '';

  const st = d.storage;
  const stHtml = st && Object.keys(st).length ? Object.entries(st).map(([origin, kv]) => `

      <div class="row mb2"><span class="badge accent mono">${esc(origin)}</span><span class="faint fs11">${Object.keys(kv || {}).length} 项</span></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th style="width:34%">key</th><th>value</th></tr></thead><tbody>
      ${Object.entries(kv || {}).map(([k, v]) => `<tr><td class="mono ellip" style="max-width:220px" title="${escAttr(k)}">${esc(k)}</td><td class="mono ellip" style="max-width:420px" title="${escAttr(v)}">${esc(trunc(v, 120))}</td></tr>`).join('') || '<tr><td colspan="2" class="faint">空</td></tr>'}
      </tbody></table></div>
    </div>`).join('') : (st ? '<div class="faint fs12">没有读到数据。填一个 origin 再读。</div>' : '');

  const targets = d.targets;
  const targetsHtml = targets === null ? '<div class="faint fs12">点「列标签页」查看。</div>'
    : targets.length ? targets.map((t) => `<div class="tile" data-act="target-switch" data-tid="${escAttr(t.targetId)}">
        <span class="badge ${t.type === 'page' ? 'accent' : ''}">${esc(t.type || '—')}</span>

        <button class="btn xs ghost" data-act="target-close" data-tid="${escAttr(t.targetId)}" data-turl="${escAttr(t.url || '')}">关闭</button>
      </div>`).join('') : '<div class="faint fs12">没有标签页。</div>';

  return `<div class="view-inner view-enter">
    <div class="toolbar">

      <span class="badge ${cur && cur.state === 'running' ? 'ok' : ''}">${cur ? esc(stateLabel(cur.state)) : '—'}</span>

        <button class="btn xs" data-act="cookie-import">导入</button>
        <button class="btn xs" data-act="cookie-export" data-fmt="cdp">导出 JSON</button>
        <button class="btn xs" data-act="cookie-export" data-fmt="netscape">导出 Netscape</button>
        <button class="btn xs danger" data-act="cookie-clear">清空</button>
      </div>
      <div class="row mb3">

          <input class="input" id="d-cookie-q" placeholder="过滤 domain / name / value" value="${escAttr(d.cookieQ)}">
        </div>

      </div>
      <div class="table-wrap" style="max-height:320px">
        <table class="tbl"><thead><tr>
          <th>domain</th><th>name</th><th>value（截断）</th><th style="width:64px">HttpOnly</th><th style="width:56px">Secure</th><th style="width:140px">过期</th>
        </tr></thead><tbody>${cookieRows}</tbody></table>

    <div class="glass card mb4">
      <div class="card-h"><h3 class="card-title">localStorage</h3><div class="grow"></div>

        <button class="btn xs" data-act="storage-write">写入</button>

      <div class="field mb3">

        <textarea class="textarea mono" id="d-origins" placeholder="https://www.xiaohongshu.com&#10;https://example.com">${escAttr(d.origins || '')}</textarea>
        <div class="hint">localStorage 按源隔离，必须指明读哪个站。</div>
      </div>
      ${stHtml}
      <div id="d-storage-edit"></div>
    </div>

    <div class="grid-2">
      <div class="glass card">
        <div class="card-h"><h3 class="card-title">页面操作</h3></div>
        <div class="field mb3">
          <label>导航</label>
          <div class="row"><input class="input mono" id="d-url" value="${escAttr(d.url || '')}" placeholder="https://example.com" style="flex:1"><label class="check"><input type="checkbox" id="d-newtab" ${d.newTab ? 'checked' : ''}> 新标签</label></div>
        </div>
        <div class="row mb3">
          <button class="btn sm" data-act="page-nav">导航</button>

          <button class="btn sm" data-act="page-targets">列标签页</button>
        </div>
        <div class="field mb3">
          <label>执行 JS 表达式</label>
          <textarea class="textarea mono" id="d-expr" placeholder="document.title">${escAttr(d.expr || 'document.title')}</textarea>
        </div>
        <button class="btn sm" data-act="page-eval">执行</button>
        ${d.evalResult !== null && d.evalResult !== undefined ? `<pre class="codeblock mt3">${esc(jsonPretty(d.evalResult))}</pre>` : ''}
        ${d.text ? `<div class="sect-h">可见文字</div><pre class="codeblock">${esc(trunc(d.text, 4000))}</pre>` : ''}
        ${d.shot ? `<div class="sect-h">截图 <button class="btn xs ghost right" data-act="shot-full">全屏查看</button></div><img class="shot-view" src="${escAttr(d.shot)}" alt="页面截图">` : ''}
        ${targets !== null ? `<div class="sect-h">标签页</div><div style="display:flex;flex-direction:column;gap:5px">${targetsHtml}</div>` : ''}
      </div>
      <div class="glass card">
        <div class="card-h"><h3 class="card-title">说明</h3></div>
        <div class="kv">
          <span class="kv-k">cookie 读取</span><span class="kv-v">只能在运行时读：停止状态下 Chromium 的 cookie 文件是 OS 密钥加密的密文。</span>
          <span class="kv-k">管理标签页</span><span class="kv-v">页面类操作都在专属管理页里跑，不会劫持你正在看的标签。</span>
          <span class="kv-k">导入格式</span><span class="kv-v">粘贴 Playwright / CDP 的 cookie 数组即可。replace 先清空，merge 合并。</span>
        </div>
      </div>

}

/* ── 数据视图的动作 ───────────────────────────────────────────────────────── */
async function dataReadCookies() {
  const ref = S.data.profile;
  const start = $('#d-start') ? $('#d-start').checked : false;
  S.busy.add('cookie');
  try {
    const d = await api('GET', `/api/v1/profiles/${encodeURIComponent(ref)}/cookies?fmt=cdp`);
    S.data.cookies = d.cookies || [];
    toast(`已读 ${S.data.cookies.length} 条 cookie`, 'ok');
    renderView();
  } catch (e) {
    if (e.status === 409 && !start) {
      toast('环境没在运行', 'err', { code: e.code, hint: '勾上「未运行时自动启动」，或先手动启动环境。' });
    } else { toastErr(e, '读 cookie 失败'); }
  } finally { S.busy.delete('cookie'); }
}

function openCookieImport() {
  const body = `
    <div class="field mb3">
      <label>粘贴 cookie JSON（Playwright / CDP 的数组格式，或 {"cookies":[...]}）</label>
      <textarea class="textarea mono" id="ci-json" style="min-height:180px" placeholder='[{"name":"sid","value":"abc","domain":".example.com","path":"/"}]'></textarea>
    </div>
    <div class="row">
      <label class="check"><input type="radio" name="ci-mode" value="merge" checked> merge（合并）</label>
      <label class="check"><input type="radio" name="ci-mode" value="replace"> replace（先清空）</label>
      <div class="grow"></div>
      <label class="check"><input type="checkbox" id="ci-start" checked> 必要时启动环境</label>
    </div>
    <div class="field mt3">
      <label>或上传文件</label>
      <input class="input" type="file" id="ci-file" accept=".json,.txt" style="height:auto;padding:5px 8px">
    </div>`;
  openDialog({
    title: '导入 cookie',
    sub: '写入后会走审计日志',
    body,
    footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">取消</button><button class="btn sm primary" id="ci-go">导入</button>`,
    onMount(root) {
      const file = $('#ci-file', root);
      file.addEventListener('change', async () => {
        const f = file.files && file.files[0];
        if (!f) return;
        const text = await f.text();
        $('#ci-json', root).value = text;
      });
      $('#ci-go', root).addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        let raw = $('#ci-json', root).value.trim();
        if (!raw) { toast('没有内容可导入', 'err'); return; }
        let arr;
        try {
          const parsed = JSON.parse(raw);
          arr = Array.isArray(parsed) ? parsed : parsed.cookies;
        } catch (err) {
          toast('JSON 解析失败', 'err', { hint: err.message });
          return;
        }
        if (!Array.isArray(arr) || !arr.length) { toast('cookie 数组是空的', 'err'); return; }
        const mode = ($('input[name="ci-mode"]:checked', root) || {}).value || 'merge';
        btn.classList.add('loading');
        try {
          const r = await api('PUT', `/api/v1/profiles/${encodeURIComponent(S.data.profile)}/cookies`,
            { cookies: arr, mode, start_if_needed: $('#ci-start', root).checked });
          toast(`导入完成：成功 ${r.ok ?? '—'}，失败 ${r.fail ?? 0}，过期 ${r.expired ?? 0}`, (r.fail ? 'pending' : 'ok'),
            { detail: r.failures && r.failures.length ? jsonBrief(r.failures, 300) : '' });
          closeDialog();
          await dataReadCookies();
        } catch (e) { toastErr(e, '导入失败'); btn.classList.remove('loading'); }
      });
    },
  });
}

async function exportCookies(fmt) {
  try {
    if (fmt === 'netscape') {
      const resp = await api('GET', `/api/v1/profiles/${encodeURIComponent(S.data.profile)}/cookies?fmt=netscape`, null, { raw: true });
      const text = await resp.text();
      downloadBlob(new Blob([text], { type: 'text/plain' }), `cookies-${S.data.profile.slice(0, 8)}.txt`);
    } else {
      const d = await api('GET', `/api/v1/profiles/${encodeURIComponent(S.data.profile)}/cookies?fmt=cdp`);
      downloadBlob(new Blob([JSON.stringify(d.cookies || [], null, 2)], { type: 'application/json' }), `cookies-${S.data.profile.slice(0, 8)}.json`);
    }
    toast('已导出', 'ok');
  } catch (e) { toastErr(e, '导出失败'); }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function storageRead() {
  const origins = ($('#d-origins') || {}).value || '';
  const list = origins.split('\n').map((x) => x.trim()).filter(Boolean);
  if (!list.length) { toast('先填至少一个 origin', 'err'); return; }
  try {
    const qs = list.map((o) => 'origin=' + encodeURIComponent(o)).join('&');
    const d = await api('GET', `/api/v1/profiles/${encodeURIComponent(S.data.profile)}/storage?${qs}`);
    S.data.storage = d.storage || {};
    renderView();
  } catch (e) { toastErr(e, '读 localStorage 失败'); }
}

function openStorageWrite() {
  const cur = S.data.storage || {};
  const seed = Object.keys(cur).length ? jsonPretty(cur) : '{\n  "https://example.com": {\n    "k": "v"\n  }\n}';
  openDialog({
    title: '写 localStorage',
    sub: '按 origin 分组写入',
    body: `<div class="field"><label>mapping（JSON）</label>
      <textarea class="textarea mono" id="sw-json" style="min-height:220px">${esc(seed)}</textarea></div>
      <label class="check mt3"><input type="checkbox" id="sw-start" checked> 必要时启动环境</label>`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">取消</button><button class="btn sm primary" id="sw-go">写入</button>`,
    wide: true,
    onMount(root) {
      $('#sw-go', root).addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        let mapping;
        try { mapping = JSON.parse($('#sw-json', root).value); }
        catch (err) { toast('JSON 解析失败', 'err', { hint: err.message }); return; }
        btn.classList.add('loading');
        try {
          const r = await api('PUT', `/api/v1/profiles/${encodeURIComponent(S.data.profile)}/storage`,
            { mapping, start_if_needed: $('#sw-start', root).checked });
          toast('已写入', 'ok', { detail: jsonBrief(r.report, 200) });
          closeDialog();
        } catch (e) { toastErr(e, '写入失败'); btn.classList.remove('loading'); }
      });
    },
  });
}

<script>
'use strict';
/* ============================================================================
   13 · 视图：扩展

function renderExtensions() {

      <td><div class="cell-main mono">${esc(e.slug)}</div>${e.name && e.name !== e.slug ? `<div class="cell-sub">${esc(e.name)}</div>` : ''}</td>
      <td class="mono">${esc(e.version || '—')}</td>
      <td class="mono faint" title="${escAttr(e.sha256 || '')}">${esc((e.sha256 || '').slice(0, 12) || '—')}</td>
      <td class="mono ellip" style="max-width:250px" title="${escAttr(e.path || '')}">${esc(trunc(e.path, 46))}</td>

      <td class="mono faint">${fmtTime(e.added_at)}</td>
      <td><div class="acts">
        <button class="btn xs" data-act="ext-bind" data-slug="${escAttr(e.slug)}" data-ver="${escAttr(e.version || '')}">绑定</button>
        <button class="btn xs danger" data-act="ext-del" data-slug="${escAttr(e.slug)}" data-ver="${escAttr(e.version || '')}">删除</button>

  return `<div class="view-inner view-enter">
    <div class="toolbar">
      <span class="faint fs12">共 ${list.length} 个扩展</span>

      <button class="btn sm primary" data-act="ext-install">＋ 安装扩展</button>

      <table class="tbl"><thead><tr>

// 「扩展包」= 扩展 **及其数据** 的集合，可以设成"新建环境默认带上"。
//
// 为什么必须在 web 控制台里也能做：用户的原话是"把插件的及其数据打包放到我的
// 控制台里面""以后创建浏览器时默认就把这些数据都带上（当然也可以选择关闭）"。
// 而之前这个能力**只有桌面客户端**的「扩展包」面板有，浏览器里打开控制台
// （本机 127.0.0.1:8730 或远程）根本找不到入口 —— 功能在、入口不在，等于没有。
function renderPacks() {
  const bag = S.packs;
  if (bag === null) {
    return `<div class="mt4">${pendingCard('扩展包', 'GET /api/v1/packs 尚未返回有效数据')}</div>`;
  }
  const list = bag.packs || [];
  const rows = list.length ? list.map((p) => `<tr>
      <td><div class="cell-main">${esc(p.name || p.id)}</div>
        <div class="cell-sub mono">${esc(p.id)}</div></td>
      <td class="mono">${p.extension_count ?? 0}</td>
      <td class="mono">${p.with_data ?? 0}</td>
      <td>${p.is_default
        ? '<span class="badge ok"><i class="dot ok"></i>默认带上</span>'
        : '<span class="muted">不自动</span>'}</td>
      <td class="mono faint">${esc(p.size_human || '—')}</td>
      <td><div class="acts">
        <button class="btn xs" data-act="pack-default" data-id="${escAttr(p.id)}" data-on="${p.is_default ? '0' : '1'}">${p.is_default ? '取消默认' : '设为默认'}</button>
        <button class="btn xs ghost" data-act="pack-usage" data-id="${escAttr(p.id)}" data-name="${escAttr(p.name)}">用在哪些浏览器</button>
        <button class="btn xs danger" data-act="pack-del" data-id="${escAttr(p.id)}">删除</button>
      </div></td>
    </tr>`).join('') : `<tr><td colspan="6"><div class="empty"><b>还没有扩展包</b>
      点右上「从 Chrome 目录导入」，填那个浏览器的 <span class="mono">User Data</span> 目录即可
      （RXYCDP / Roxy / Chrome 都认）。</div></td></tr>`;

  return `<div class="mt4">
    <div class="toolbar">
      <span class="faint fs12">扩展包 ${list.length} 个 · 默认带上 ${list.filter((p) => p.is_default).length} 个</span>

    </div>
    <div class="table-wrap">
      <table class="tbl"><thead><tr>
        <th style="min-width:200px">扩展包</th>
        <th style="width:90px">扩展数</th>

        <th style="width:90px">大小</th>
        <th style="width:170px;text-align:right">操作</th>
      </tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="note">扩展包把扩展的**代码与设置数据**一起存。设成默认后，新建环境会自动带上；
      不想要的环境可在环境详情里取消。注意：官方 Chrome 137+ 忽略 --load-extension，
      数据会带过去但浏览器不一定加载（环境详情里的 extensions_active 会如实说明）。</div>
  </div>`;
}

function openPackImport() {
  openDialog({

      </div>
      <div class="row" style="gap:8px;align-items:center">
        <button class="btn sm" id="pk-scan" type="button">扫描本机</button>
        <span class="fs11 faint" id="pk-scan-msg"></span>
      </div>
      <div id="pk-found" class="mt2"></div>
      <div class="field">
        <label>包名（可留空）</label>
        <input class="input" id="pk-name" placeholder="例如 RXYCDP 常用插件" style="width:100%">
      </div>
      <label class="check"><input type="checkbox" id="pk-default" checked> 设为新建环境的默认包（以后创建浏览器自动带上）</label>`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">取消</button>
      <button class="btn sm primary" id="pk-go">导入</button>`,
    onMount(root) {
      // 「扫描本机」：把有扩展的浏览器配置目录列出来，点一条就填进输入框。
      // 没有这一步，用户得自己去找 `User Data` 在哪 —— 大多数人会卡死在这里。
      $('#pk-scan', root).addEventListener('click', async (ev) => {
        const b = ev.currentTarget;
        const msg = $('#pk-scan-msg', root);
        const box = $('#pk-found', root);
        b.classList.add('loading');
        msg.textContent = '正在扫描 …';
        try {
          const r = await api('GET', '/api/v1/packs/scan-browsers');
          const list = (r && r.candidates) || [];
          if (!list.length) {
            msg.textContent = '没找到带扩展的浏览器配置目录（可手动填路径）';
            box.innerHTML = '';
            return;
          }
          msg.textContent = `找到 ${list.length} 个`;
          box.innerHTML = list.map((c) => `
            <div class="row" style="gap:8px;align-items:center;padding:4px 0">
              <button class="btn xs" type="button" data-pick="${escAttr(c.path)}">选这个</button>
              <span class="mono fs11 ellip" style="max-width:420px" title="${escAttr(c.path)}">${esc(c.path)}</span>
              <span class="badge">${esc(c.browser || '?')}</span>
              <span class="fs11 faint">${c.extension_count} 个扩展</span>
            </div>`).join('');
          box.querySelectorAll('[data-pick]').forEach((el) => {
            el.addEventListener('click', () => {
              $('#pk-path', root).value = el.dataset.pick;
              msg.textContent = '已填入';
            });
          });
        } catch (e) {
          msg.textContent = '扫描失败：' + ((e && e.message) || e);
        } finally {
          b.classList.remove('loading');
        }
      });
      const btn = $('#pk-go', root);
      btn.addEventListener('click', async () => {
        const path_ = ($('#pk-path', root).value || '').trim();
        if (!path_) { toast('先填 User Data 目录', 'err'); return; }
        btn.classList.add('loading');
        try {
          const r = await api('POST', '/api/v1/packs/import', {
            from_chrome: path_,
            name: ($('#pk-name', root).value || '').trim(),
            as_default: $('#pk-default', root).checked,
          });
          const d = r || {};
          toast(`已导入 ${d.extension_count ?? 0} 个扩展（带数据 ${d.with_data ?? 0} 个）`, 'ok');
          closeDialog();
          await loadPacks();
          render();
        } catch (e) {
          toastErr(e, '导入失败');
        } finally {
          btn.classList.remove('loading');
        }
      });
    },
  });
}

function openExtInstall() {
  openDialog({
    title: '安装扩展到中央库',
    sub: '填扩展目录（含 manifest.json）或 zip 的绝对路径',
    body: `<div class="field">
      <label>绝对路径</label>
      <input class="input mono" id="ei-path" placeholder="/root/exts/ublock-origin">

    </div>`,

        const path = input.value.trim();
        if (!path) { toast('路径不能为空', 'err'); return; }
        btn.classList.add('loading');
        try {
          const r = await api('POST', '/api/v1/extensions/install', { path });

          await loadExtensions(true);
          renderView();

function openExtBind(slug, version) {
  const opts = S.profiles.map((p) => `<option value="${escAttr(p.id)}">${esc(p.name)}${(p.extensions || []).includes(slug) ? '（已绑定）' : ''}</option>`).join('');
  openDialog({
    title: `绑定扩展 ${slug}`,
    body: `<div class="field"><label>选择环境</label><select class="select" id="eb-profile">${opts || '<option value="">还没有环境</option>'}</select></div>
      <div class="fs11 faint mt2">绑定后需要重启该环境。注意：能否真的加载取决于内核 —— 官方 Chrome 137 起忽略 --load-extension，装了也不会生效；用 ungoogled-chromium 才加载。启动后看环境详情里的 extensions_active 字段就知道实际有没有加载。</div>`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">取消</button>

    onMount(root) {

        if (!pid.value) { toast('先选一个环境', 'err'); return; }
        const btn = ev.currentTarget;
        btn.classList.add('loading');
        try {
          await api('POST', `/api/v1/profiles/${encodeURIComponent(pid.value)}/extensions`, { slug, version: version || undefined });
          toast(`已把 ${slug} 绑定到环境`, 'ok');
          closeDialog();

          renderView();

          await api('DELETE', `/api/v1/profiles/${encodeURIComponent(pid.value)}/extensions/${encodeURIComponent(slug)}`);
          toast('已解绑', 'ok');
          closeDialog();
          await Promise.all([loadExtensions(true), loadProfiles()]);
          renderView();
        } catch (e) { toastErr(e, '解绑失败'); }
      });

  });
}

/**
 * 「不保存直接检测」这块表单在"库为空/接口异常"和"正常列表"两个分支都要出现，
 * 之前是复制粘贴的两份，id 全撞（px-host 等各出现两次），点哪个都是碰运气命中。
 * 收成一个函数后只剩一份 DOM。
 */
function proxyInlineCheckCard() {
  return `<div class="glass card">
      <div class="card-h"><h3 class="card-title">不保存直接检测</h3></div>
      <div class="form-grid">

        ${field('host:port', `<input class="input mono" id="px-host" placeholder="127.0.0.1:7890">`)}
        ${field('用户名', `<input class="input mono" id="px-user" placeholder="可留空">`)}
        ${field('密码', `<input class="input mono" type="password" id="px-pass" placeholder="可留空" autocomplete="new-password">`)}
      </div>
      <div class="row mt3"><button class="btn sm" data-act="proxy-check-inline">检测出口</button>
        <div class="grow"></div><span class="faint fs11" id="px-inline-result"></span></div>
      <div class="hint mt2">凭据只在这一次请求里出现，不落库。</div>

}

function renderProxies() {

      <td>${x.last_ok === true ? '<span class="badge ok">通</span>' : x.last_ok === false ? '<span class="badge bad">失败</span>' : '<span class="muted">未检测</span>'}</td>

      <td><div class="acts">

/** 批量导入代理：一行一个。
 *
 * 支持的写法（后端 proxylib.parse_line 负责解析）：
 *   socks5://user:pass@host:port     http://user:pass@host:port
 *   host:port:user:pass              host:port
 * 行尾可以跟 `# 备注` 当 label。失败行会单独列出来，不影响其它行。
 */
function proxyImportDialog() {
  openDialog({
    title: '批量导入代理',
    sub: '一行一个；支持 socks5://user:pass@host:port、http://…、host:port:user:pass、host:port，行尾可写 # 备注',
    wide: true,
    body: `<textarea class="input mono" id="pi-text" rows="12" spellcheck="false"
      style="width:100%;resize:vertical;line-height:1.6"
      placeholder="socks5://user:pass@1.2.3.4:20000&#10;http://user:pass@5.6.7.8:8080&#10;9.9.9.9:1080:user:pass&#10;10.0.0.1:3128  # 直连无认证"></textarea>
      <div class="hint mt2">密码不会回显，也不会写进日志。重复的代理会自动跳过。</div>
      <div id="pi-result" class="mt3"></div>`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">关闭</button>
      <button class="btn sm primary" id="pi-go">导入</button>`,
    onMount(root) {
      $('#pi-go', root).addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        const text = $('#pi-text', root).value || '';
        if (!text.trim()) { toast('先粘贴至少一行代理', 'err'); return; }
        btn.disabled = true;
        btn.textContent = '导入中…';
        try {
          // 注意：这个端点直接返回 {ok, data}，不再套一层
          const r = await fetch('/api/v1/proxies/import', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, S.token ? { Authorization: 'Bearer ' + S.token } : {}),
            body: JSON.stringify({ text }),
          });
          const body = await r.json();
          if (!body.ok) throw new Error(body.message || ('HTTP ' + r.status));
          const d = body.data || {};
          const failed = d.failed || [];
          $('#pi-result', root).innerHTML =
            `<div class="card"><b>导入完成</b>：成功 ${esc(d.imported || 0)} 条，
              跳过重复 ${esc(d.skipped || 0)} 条，忽略空行/注释 ${esc(d.ignored || 0)} 条，
              失败 ${esc(failed.length)} 条</div>` +
            (failed.length
              ? `<div class="card mt2"><b>失败明细</b><ul class="mt2">${failed.slice(0, 8).map((f) =>
                  `<li class="mono">${esc(String(f.line || '').slice(0, 60))} → ${esc(f.error || '')}</li>`).join('')}</ul>
                 ${failed.length > 8 ? `<div class="hint">还有 ${failed.length - 8} 条未显示</div>` : ''}</div>`
              : '');
          toast(`导入 ${d.imported || 0} 条代理`, 'ok');
          reloadView('proxies');
        } catch (e) {
          $('#pi-result', root).innerHTML = `<div class="card bad">导入失败：${esc(e.message || '未知错误')}</div>`;
          toast('导入失败', 'err');
        } finally {
          btn.disabled = false;
          btn.textContent = '导入';
        }
      });
    },
  });
}

function proxyForm(proxy) {
  const x = proxy || {};
  return {
    title: proxy ? `编辑代理 ${x.label || ''}` : '新增代理',
    body: `<div class="form-grid">
        ${field('label', `<input class="input" id="pf-label" value="${escAttr(x.label || '')}" placeholder="例如 香港住宅 01">`)}

        ${field('scheme', `<select class="select" id="pf-scheme">${['http', 'https', 'socks5', 'socks5h'].map((s) => `<option ${(x.scheme || 'http') === s ? 'selected' : ''}>${s}</option>`).join('')}</select>`)}
        ${field('host', `<input class="input mono" id="pf-host" value="${escAttr(x.host || '')}" placeholder="127.0.0.1">`)}
        ${field('port', `<input class="input mono" id="pf-port" type="number" value="${escAttr(x.port || '')}" placeholder="7890">`)}
        ${field('用户名', `<input class="input mono" id="pf-user" value="${escAttr(x.username || '')}" placeholder="可留空">`)}
        ${field('密码', `<input class="input mono" type="password" id="pf-pass" placeholder="${proxy ? '留空＝不改' : '可留空'}">`, proxy && x.has_password ? '库里已存密码。留空表示不覆盖。' : '')}
      </div>`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">取消</button><button class="btn sm primary" id="pf-go">${proxy ? '保存' : '新增'}</button>`,
    onMount(root) {
      $('#pf-go', root).addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        const v = (id) => ($('#' + id, root) || {}).value || '';
        const payload = {
          label: v('pf-label').trim(), scheme: v('pf-scheme'), host: v('pf-host').trim(),
          port: Number(v('pf-port')) || 0, username: v('pf-user').trim(),
          country: v('pf-country').trim().toUpperCase(),
        };

        btn.classList.add('loading');
        try {
          if (proxy) await api('PATCH', `/api/v1/proxies/${encodeURIComponent(proxy.id)}`, payload);
          else await api('POST', '/api/v1/proxies', payload);
          toast(proxy ? '已保存' : '已新增代理', 'ok');
          closeDialog();
          await loadProxies(true);
          renderView();
        } catch (e) { toastErr(e, '保存失败'); btn.classList.remove('loading'); }
      });
    },
  };
}

function renderSync() {
  const st = S.syncState;
  const remote = S.syncRemote;
  if (st === null) {
    return `<div class="view-inner view-enter">${pendingCard('同步中心', 'GET /api/v1/sync/state 尚未返回有效数据')}</div>`;
  }
  // 输入框优先用内存里的草稿，其次才是「记住」过的值；这样轮询重画不会吞掉刚输入的内容
  const pw = S.syncPw || localStorage.getItem('zw_sync_pw') || '';
  const items = st.profiles || [];
  const nameOf = {};
  for (const p of S.profiles) nameOf[p.id] = p.name;

  const rows = items.length ? items.map((x) => {
    const remoteRow = ((remote && remote.profiles) || []).find((r) => r.profile_id === x.profile_id);
    const remoteRev = remoteRow ? (remoteRow.latest_revision ?? remoteRow.revisions ?? null) : null;
    const same = remoteRev !== null && remoteRev === x.revision;
    return `<tr>
      <td><div class="cell-main">${esc(x.name || nameOf[x.profile_id] || '—')}</div><div class="cell-sub mono">${esc((x.profile_id || '').slice(0, 12))}</div></td>
      <td class="mono">${esc(x.revision ?? 0)}</td>
      <td class="mono">${remoteRev === null ? '<span class="muted">—</span>' : esc(remoteRev)}</td>
      <td>${remoteRev === null ? '<span class="badge">未推送</span>' : same ? '<span class="badge ok">一致</span>' : '<span class="badge warn">有差异</span>'}</td>
      <td>${syncChip(x.state, x.revision)}</td>
      <td class="mono faint">${esc(x.key_fp || '—')}</td>
      <td><div class="acts">
        <button class="btn xs" data-act="sync-push" data-id="${escAttr(x.profile_id)}">推送</button>
        <button class="btn xs" data-act="sync-pull" data-id="${escAttr(x.profile_id)}">拉取</button>
        <button class="btn xs ghost" data-act="sync-diff" data-id="${escAttr(x.profile_id)}">差异</button>
        <button class="btn xs ghost" data-act="sync-history" data-id="${escAttr(x.profile_id)}">历史</button>
      </div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="7"><div class="empty"><b>没有可同步的环境</b>同步只处理 sync_enabled=true 的环境。</div></td></tr>`;

  const remoteRows = remote === null ? `<div class="faint fs12">读取中…</div>`
    : (remote.profiles || []).length ? (remote.profiles || []).map((r) => {
      const local = items.find((x) => x.profile_id === r.profile_id);
      return `<div class="tile" style="cursor:default">
        <span class="badge mono">${esc((r.profile_id || '').slice(0, 12))}</span>
        <span style="min-width:0"><div class="ellip">${esc(local ? local.name : '（本机没有）')}</div>
          <div class="meta mono">rev ${esc(r.latest_revision ?? r.revisions ?? '—')} · ${fmtBytes(r.latest_size)} · ${fmtAgo(r.updated_at)} · fp ${esc(r.key_fp || '—')}</div></span>
        <button class="btn xs" data-act="sync-import" data-id="${escAttr(r.profile_id)}">${local ? '拉取' : '拉取并导入'}</button>
      </div>`;
    }).join('') : '<div class="faint fs12">远端索引是空的。</div>';

  return `<div class="view-inner view-enter">
    <div class="glass card mb4">
      <div class="card-h"><h3 class="card-title">同步中心</h3><div class="grow"></div>
        <span class="badge ${st.hub_configured ? 'ok' : 'bad'}">${st.hub_configured ? '已配置' : '未配置'}</span>
        <button class="btn xs" data-act="sync-push-all">全部推送</button>
      </div>
      <div class="kv mb4">
        <span class="kv-k">hub 地址</span><span class="kv-v mono">${esc(st.hub_url || '未配置')}</span>
        <span class="kv-k">本机节点</span><span class="kv-v mono">${esc((S.meta && S.meta.node_id) || '—')}</span>
        <span class="kv-k">待推送</span><span class="kv-v mono">${esc(items.filter((x) => x.state === 'dirty').length)}</span>
      </div>
      <div class="form-grid">
        ${field('主密码', `<input class="input mono" type="password" id="sync-pw" value="${escAttr(pw)}" placeholder="ZW_SYNC_PASSWORD" autocomplete="new-password">`,
          '用于加密快照。口令错了密钥指纹对不上，后端会在落盘前中止——这是硬约束，不是警告。')}
        <div class="field"><label>记住主密码</label>
          <div style="padding-top:6px">
            <label class="switch"><input type="checkbox" id="sync-remember" ${pw ? 'checked' : ''}> 保存在本机 localStorage</label>
            <div class="hint mt2">默认不记住。勾上会明文存在 <span class="mono">zw_sync_pw</span> 里，共用电脑上请勿勾选。</div>

    <div class="glass card mb4">
      <div class="card-h"><h3 class="card-title">本机环境</h3><div class="grow"></div><span class="faint fs11">${items.length} 个启用同步</span></div>
      <div class="table-wrap">

async function syncPassword() {
  // 顺序：状态树里的草稿 → 输入框 → 「记住」过的值。状态树优先，因为在别的视图里
  // 触发同步动作时输入框根本不存在于 DOM，只有状态树还留着用户填过的口令。
  let pw = S.syncPw || ($('#sync-pw') || {}).value || localStorage.getItem('zw_sync_pw') || '';
  const remember = ($('#sync-remember') || {}).checked;
  if (remember && pw) localStorage.setItem('zw_sync_pw', pw);
  if (!remember) localStorage.removeItem('zw_sync_pw');
  if (!pw) {
    toast('需要主密码', 'err', { hint: '在「同步中心」卡片里填 ZW_SYNC_PASSWORD。它用来派生加解密密钥，服务端不保存明文。' });
    return null;
  }
  return pw;
}

async function syncAction(kind, id) {
  const pw = await syncPassword();
  if (!pw) return;
  try {
    if (kind === 'push') {
      const r = await api('POST', `/api/v1/sync/${encodeURIComponent(id)}/push`, { password: pw, cross_machine: true });
      toast('已推送', 'ok', { detail: `revision ${r.revision ?? '—'} · ${jsonBrief(r, 200)}` });
    } else if (kind === 'pull') {
      const r = await api('POST', `/api/v1/sync/${encodeURIComponent(id)}/pull`, { password: pw, write_cookies: true });
      toast('已拉取', 'ok', { detail: jsonBrief(r, 200) });
    }
    await loadSync(true);
    renderView();
  } catch (e) {
    // 口令错是高频失败，单独给一条人话指引
    const pwBad = /密钥|指纹|412|KEY_MISMATCH|password/i.test(e.message + (e.code || ''));
    toastErr(e, kind === 'push' ? '推送失败' : '拉取失败');
    if (pwBad) toast('密钥指纹不一致', 'err', { hint: '主密码和远端快照的口令不一样，或远端用了另一台机器的密钥。换对的那个再试。' });
  }
}

// 「内核」卡片：policy / 路径 / 版本 / 能不能加载扩展 / 下载进度 + 一键下载。
//
// 为什么必须有：默认内核已经换成 ungoogled-chromium，而这台机器上如果还没有，
// 启动环境会报 ENGINE_NOT_FOUND。以前界面里只有一行"内核 版本 — 不可用"，
// 用户既不知道为什么要换、也不知道怎么装 —— 只能去翻文档找命令。
function renderEngineCard() {
  const e = S.engine;
  if (!e) {
    return `<div class="glass card mb4"><div class="card-h"><h3 class="card-title">内核</h3></div>
      <div class="faint fs12">读取中…</div></div>`;
  }
  const d = e.download || {};
  const pct = d.percent || 0;
  const busy = ['resolving', 'downloading', 'extracting', 'verifying'].includes(d.state);
  const loadable = e.extensions_loadable;
  // 探针在后台跑（不同步阻塞接口），所以这里可能先看到"检测中"
  const badge = loadable === true
    ? '<span class="badge ok"><i class="dot ok"></i>能加载扩展</span>'
    : (loadable === false
        ? '<span class="badge bad">不能加载扩展</span>'
        : (e.probe_pending
            ? '<span class="badge warn">检测中…</span>'
            : '<span class="badge">未检测</span>'));
  const prog = busy
    ? `<div class="mt2"><div class="faint fs12">${esc(d.message || d.state)}${d.percent ? ' · ' + d.percent + '%' : ''}</div></div>`
    : '';
  const err = d.state === 'error' && d.error
    ? `<div class="notice bad mt2"><span class="nic">⛔</span><div>${esc(d.error)}</div></div>`
    : '';
  return `<div class="glass card mb4">
    <div class="card-h"><h3 class="card-title">内核</h3><div class="grow"></div>
      ${badge}
      <button class="btn xs" data-act="engine-install">${e.path ? '重新下载' : '下载内核'}</button>
      <button class="btn xs ghost" data-act="svc-takeover" title="装完新版但版本号没变时点这个：让新版接管端口，不用手动杀进程">用新版重启服务</button></div>
    <div class="kv">
      <span class="kv-k">策略</span><span class="kv-v mono">${esc(e.policy || '—')}</span>
      <span class="kv-k">当前内核</span><span class="kv-v mono ellip" title="${escAttr(e.path || '')}">${esc(e.path || '（没有）')}</span>
      <span class="kv-k">版本</span><span class="kv-v mono">${esc(e.version || '—')}</span>
      <span class="kv-k">自动安装</span><span class="kv-v">${e.auto_install ? '<span class="badge ok">开</span>' : '<span class="badge">关</span>'}</span>
      <span class="kv-k">引擎目录</span><span class="kv-v mono ellip" title="${escAttr(e.engine_dir || '')}">${esc(e.engine_dir || '—')}</span>
      <span class="kv-k">下载代理</span><span class="kv-v mono">${esc(((e.download_proxy || {}).proxy) || '（直连）')} <span class="faint">${esc(((e.download_proxy || {}).source) || '')}</span></span>
    </div>
    ${e.error ? `<div class="faint fs12 mt2">${esc(e.error)}</div>` : ''}
    ${prog}${err}
    <div class="faint fs12 mt2">默认用 ungoogled-chromium：官方 Chrome 137 起不加载命令行扩展，
      插件只能"放进去"而不生效。这里装好之后，新建/启动环境就会用它。</div>
  </div>`;
}

        <button class="btn xs" data-act="audit-page" data-page="${a.page + 1}" ${a.page + 1 >= pages ? 'disabled' : ''}>下一页</button>
      </div>
    </div>
  </div>`;
}
</script>
<script>
'use strict';
/* ============================================================================
   17 · 各视图的数据加载
   每个 loader 都自己决定失败怎么表现：
     · 列表类（proxies/extensions）失败 → 置 null，视图画占位态；
     · 汇总类（stats/events）失败 → 保留旧值，避免整屏数字突然变 "—"。
   ========================================================================== */
const RENDER = {
  overview: renderOverview,
  profiles: renderProfiles,
  data: renderData,
  extensions: renderExtensions,
  proxies: renderProxies,
  sync: renderSync,
  ops: renderOps,
};

async function loadMeta() {
  try {
    S.meta = await api('GET', '/api/v1/meta');
    const engineOk = !!(S.meta.engine && S.meta.engine.ok);
    $('#sf-node').textContent = S.meta.node_id || '—';
    $('#sf-engine').className = 'sf-dot ' + (engineOk ? 'ok' : 'bad');
    $('#sf-engine-txt').textContent = engineOk ? String((S.meta.engine.version || '就绪')).replace('Chromium ', '') : '缺失';
    const hubOk = !!S.meta.hub_configured;
    $('#sf-hub').className = 'sf-dot ' + (hubOk ? 'ok' : 'warn');
    $('#sf-hub-txt').textContent = hubOk ? String(S.meta.hub_url || '').replace(/^https?:\/\//, '') : '未配置';
    return true;
  } catch (e) {
    $('#sf-node').textContent = '未连接';
    $('#sf-engine').className = 'sf-dot bad';
    $('#sf-hub').className = 'sf-dot bad';
    return false;
  }
}

async function loadStats() {
  try { S.stats = await api('GET', '/api/v1/stats'); }
  catch (e) { pollFail(e, 'stats'); return false; }
  // 契约里 stats 带 groups；老后端没有这个字段，那就别把已有分组清空
  if (Array.isArray(S.stats.groups)) S.groups = S.stats.groups;
  return true;
}

let groupsPending = false;
async function loadGroups() {
  try { const d = await api('GET', '/api/v1/groups'); S.groups = d.groups || []; groupsPending = false; }
  catch (e) { if (e.todo) groupsPending = true; else pollFail(e, 'groups'); }
  // /groups 还没做时从环境表自己聚合一份，总览的分组卡片不至于空着
  if (groupsPending) {
    const m = new Map();
    for (const p of S.profiles) {
      const g = p.group_name || '';
      if (!g) continue;
      const cur = m.get(g) || { name: g, count: 0, running: 0 };
      cur.count++; if (p.state === 'running') cur.running++;
      m.set(g, cur);
    }
    S.groups = Array.from(m.values());
  }
}

async function loadProfiles() {
  try {
    const d = await api('GET', '/api/v1/profiles');
    S.profiles = Array.isArray(d.profiles) ? d.profiles : [];
    // 已删除的环境不能继续留在选择集里，否则批量操作会打到 404
    for (const id of Array.from(S.sel)) if (!S.profiles.some((p) => p.id === id)) S.sel.delete(id);
    const nav = $('#nav-profiles');
    if (nav) {
      const running = S.profiles.filter((p) => p.state === 'running').length;
      nav.textContent = String(S.profiles.length);
      nav.className = 'nav-badge' + (running ? ' hot' : '');
      nav.title = `${S.profiles.length} 个环境，${running} 个运行中`;
    }
    return true;
  } catch (e) { pollFail(e, 'profiles'); return false; }
}

async function loadEvents() {
  try { S.events = await api('GET', '/api/v1/events'); return true; }
  catch (e) { pollFail(e, 'events'); return false; }
}

async function loadProxies(force) {
  if (S.proxies !== null && !force) return true;
  try { S.proxies = await api('GET', '/api/v1/proxies'); return true; }
  catch (e) { S.proxies = null; if (!e.todo) pollFail(e, 'proxies'); return false; }
}

async function loadExtensions(force) {
  if (S.extensions !== null && !force) return true;
  try { S.extensions = await api('GET', '/api/v1/extensions'); return true; }
  catch (e) { S.extensions = null; if (!e.todo) pollFail(e, 'extensions'); return false; }
}

async function loadPacks(force) {
  if (S.packs !== null && !force) return true;
  try { S.packs = await api('GET', '/api/v1/packs'); return true; }
  catch (e) { S.packs = null; if (!e.todo) pollFail(e, 'packs'); return false; }
}

async function loadSync(force) {
  const jobs = [];
  jobs.push((async () => {
    try { S.syncState = await api('GET', '/api/v1/sync/state'); }
    catch (e) { if (S.syncState === null) S.syncState = null; pollFail(e, 'sync'); }
  })());
  jobs.push((async () => {
    try { S.syncRemote = await api('GET', '/api/v1/sync/remote'); }
    catch (e) { pollFail(e, 'sync-remote'); }
  })());
  await Promise.all(jobs);
}

async function loadAudit() {
  const p = new URLSearchParams();
  if (S.audit.profile) p.set('profile_id', S.audit.profile);
  if (S.audit.action) p.set('action', S.audit.action);
  // 后端目前只给 limit 不给 offset，所以一次多取一些再在前端切页；
  // 这样翻页不会每次都打一个新请求，也不会出现"第 2 页永远空"。
  p.set('limit', '300');
  try {
    const d = await api('GET', '/api/v1/audit?' + p.toString());
    const all = d.items || [];
    S.audit.total = d.total ?? all.length;
    S.audit.all = all;
    S.audit.items = all.slice(S.audit.page * 30, S.audit.page * 30 + 30);
    return true;
  } catch (e) { pollFail(e, 'audit'); return false; }
}

/* 轮询失败不能每 8 秒弹一次同样的红条：按 code 去重，60 秒内只提示一次 */
const pollSeen = new Map();
function pollFail(e, tag) {
  markConn(false);
  const code = (e && e.code) || 'ERROR';
  const last = pollSeen.get(tag + code) || 0;
  if (Date.now() - last < 60000) return;
  pollSeen.set(tag + code, Date.now());
  toast(`拉取${tag}失败：${e.message}`, 'err', { code, status: e.status, hint: e.hint });
}

/**
 * 按当前视图决定拉哪些接口。
 * @param {{quiet?:boolean, force?:boolean}} opt
 */
async function refreshView(opt) {
  opt = opt || {};
  const v = S.view;
  const jobs = [];
  if (v === 'overview') {
    jobs.push(loadStats(), loadProfiles(), loadEvents(), loadSync(), loadGroups(), loadProxies(), loadExtensions(), loadPacks(), loadEngine(), loadShell());
  } else if (v === 'profiles') {
    jobs.push(loadProfiles(), loadStats(), loadGroups(), loadProxies());
  } else if (v === 'data') {
    jobs.push(loadProfiles());
  } else if (v === 'ops') {
    jobs.push(loadEngine(opt.force), loadShell(opt.force));
  } else if (v === 'extensions') {
    // 扩展页现在有"扩展包"区块（插件 + 数据），进这个视图时两样一起拉。
    jobs.push(loadExtensions(opt.force), loadPacks(opt.force), loadProfiles());
  } else if (v === 'proxies') {
    jobs.push(loadProxies(opt.force), loadProfiles());
  } else if (v === 'sync') {
    jobs.push(loadSync(opt.force), loadProfiles());
  } else if (v === 'ops') {
    jobs.push(loadMeta(), loadAudit());
  }
  if (!opt.quiet && v !== 'ops') jobs.push(loadMeta());
  await Promise.all(jobs);
  // quiet 只表示"不要为失败弹红条"（pollFail 里做去重），不等于不刷新界面；
  // 否则 8 秒轮询就成了空转，数字永远停在进入页面那一刻。
  if (!opt.noRender) renderView({ soft: true });
}

/* ============================================================================
   18 · 渲染调度
   ========================================================================== */
function renderView(opt) {
  opt = opt || {};
  const box = $('#view');
  // 整块 innerHTML 会连同焦点和光标一起丢掉。这里记下焦点元素与选区，渲染完再放回去——
  // 比"焦点在输入框就跳过渲染"更好：后者会让搜索框输入时表格完全不跟着过滤。
  const ae = document.activeElement;
  const focusMemo = ae && ae.id && box.contains(ae)
    ? { id: ae.id, start: ae.selectionStart, end: ae.selectionEnd }
    : null;
  const scroll = box.scrollTop;
  const meta = VIEW_META[S.view] || VIEW_META.overview;
  $('#view-title').textContent = meta.title;
  $('#view-sub').textContent = meta.sub;
  $$('#nav .nav-item').forEach((b) => b.classList.toggle('active', b.dataset.view === S.view));

  let html;
  try {
    html = (RENDER[S.view] || renderOverview)();
  } catch (e) {
    // 渲染函数自己崩了也必须让人看见，否则就是白屏 + 无从下手
    html = `<div class="view-inner"><div class="notice bad"><span class="nic">⛔</span>
      <div><b>界面渲染出错</b><div class="mono fs11 mt1">${esc(e && e.message)}</div>
      <div class="fs11 mt1">这不影响后端，刷新页面即可恢复；如果反复出现请带上这行文字反馈。</div></div></div></div>`;
    console.error('[zw] render failed', e);
  }
  box.innerHTML = html;
  box.scrollTop = opt.soft ? scroll : 0;
  if (focusMemo) {
    const again = document.getElementById(focusMemo.id);
    if (again && again.focus) {
      again.focus({ preventScroll: true });
      if (focusMemo.start !== null && focusMemo.start !== undefined && again.setSelectionRange && /^(text|search|password|number|email|url|tel)$/.test(again.type || '')) {
        try { again.setSelectionRange(focusMemo.start, focusMemo.end); } catch (_) { /* number 类型不支持选区 */ }
      }
    }
  }
  afterRender();
}

function afterRender() {
  // indeterminate 只能用属性 API 设，HTML 属性里没有对应值
  const ck = $('#ck-all');
  if (ck && ck.dataset.indet === '1') ck.indeterminate = true;
}

function switchView(v, params) {
  if (!VIEW_META[v]) v = 'overview';
  S.view = v;
  if (params && params.group !== undefined) { S.filters.group = params.group; }
  location.hash = '#/' + v;
  closeDrawer();
  closeMenu();
  // 切视图立刻拉一次，再把骨架换成真内容——不然要等 8 秒
  $('#view').innerHTML = skeletonView();
  refreshView({ force: true }).catch(() => {});
}

/* ============================================================================
   19 · 操作实现
   ========================================================================== */
async function profileAction(id, kind) {
  const p = S.profiles.find((x) => x.id === id) || {};
  const name = p.name || id;
  if (S.busy.has(id)) return;
  S.busy.add(id);
  rerenderRows();
  try {
    if (kind === 'start') {
      const r = await api('POST', `/api/v1/profiles/${encodeURIComponent(id)}/start`, {});
      toast(`${name} 已启动`, 'ok', {
        detail: r.already_running ? '本来就在运行，复用了现有实例' : `端口 ${(r.local || {}).port || (r.profile || {}).cdp_port || '—'} · pid ${(r.local || {}).pid || '—'}`,
      });
    } else if (kind === 'stop') {
      await api('POST', `/api/v1/profiles/${encodeURIComponent(id)}/stop`);
      toast(`${name} 已停止`, 'ok');
    } else if (kind === 'restart') {
      await api('POST', `/api/v1/profiles/${encodeURIComponent(id)}/restart`, {});
      toast(`${name} 已重启`, 'ok');
    } else if (kind === 'unlock') {
      await api('POST', `/api/v1/profiles/${encodeURIComponent(id)}/unlock`);
      toast('租约已强制释放', 'ok', { hint: '如果另一个进程其实还活着，它下次写入会失败。' });
    }
  } catch (e) {
    toastErr(e, `${name} ${kind}`);
  } finally {
    S.busy.delete(id);
    await refreshView({ quiet: true, force: true });
    renderView({ soft: true });
  }
}

function rerenderRows() {
  // 只重画行，不动工具栏——避免搜索框在操作瞬间失焦
  const tb = $('#p-tbody');
  if (!tb) return;
  const rows = visibleProfiles();
  tb.innerHTML = rows.length ? rows.map(profileRow).join('') : tb.innerHTML;
}

async function batchAction(action) {
  const ids = Array.from(S.sel);
  if (!ids.length) return;
  if (action === 'delete') return batchDelete(ids);
  const label = { start: '启动', stop: '停止', restart: '重启' }[action];
  try {
    const r = await api('POST', '/api/v1/profiles/batch', { action, ids, concurrency: 3 });
    const failed = (r.results || []).filter((x) => !x.ok);
    toast(`${label}完成：成功 ${r.ok}/${r.total}`, failed.length ? 'pending' : 'ok', {
      detail: failed.length ? failed.map((f) => `${f.ref}: ${f.error}`).join('\n') : '',
    });
    S.sel.clear();
    await refreshView({ quiet: true, force: true });
    renderView({ soft: true });
  } catch (e) { toastErr(e, `批量${label}`); }
}

function batchDelete(ids) {
  confirmDanger({
    title: '删除环境',
    tone: 'bad',
    sub: '会同时移除该环境的用户数据目录',
    body: `即将删除 <b>${ids.length}</b> 个环境及其本地数据目录（cookie、登录态、缓存都会没）。<br>
      被引用的运行中环境会先被停止。确认文字：<span class="mono">DELETE</span>`,
    confirmText: 'DELETE',
    okLabel: `删除 ${ids.length} 个`,
    async action() {
      let ok = 0; const errs = [];
      for (const id of ids) {
        try { await api('DELETE', `/api/v1/profiles/${encodeURIComponent(id)}?purge=true`); ok++; }
        catch (e) { errs.push(`${id.slice(0, 8)}: ${e.message}`); }
      }
      toast(`删除完成：${ok}/${ids.length}`, errs.length ? 'pending' : 'ok', { detail: errs.join('\n') });
      S.sel.clear();
      await refreshView({ quiet: true, force: true });
      renderView({ soft: true });
    },
  });
}

async function deleteOne(id) {
  const p = S.profiles.find((x) => x.id === id) || {};
  confirmDanger({
    title: `删除环境 ${p.name || ''}`,
    tone: 'bad',
    sub: '不可撤销',
    body: `会删掉环境记录与整个数据目录（<span class="mono">${esc(p.name || id)}</span> 的 cookie、登录态、缓存）。
      如果只是想清缓存，用「清理缓存」而不是删除。确认文字：<span class="mono">DELETE</span>`,
    confirmText: 'DELETE',
    okLabel: '删除',
    async action() {
      await api('DELETE', `/api/v1/profiles/${encodeURIComponent(id)}?purge=true`);
      toast(`已删除 ${p.name || ''}`, 'ok');
      S.sel.delete(id);
      await refreshView({ quiet: true, force: true });
      renderView({ soft: true });
    },
  });
}

function resetFingerprint(id) {
  const p = S.profiles.find((x) => x.id === id) || {};
  confirmDanger({
    title: '重置指纹',
    tone: 'bad',
    sub: '换设备 = 换身份，登录态必然失效',
    body: `这会分配新的指纹种子并<b>清空该环境的 cookie</b>。需要手打环境名 <b class="mono">${esc(p.name || '')}</b> 才能继续。`,
    confirmText: p.name || '',
    okLabel: '重置指纹',
    async action() {
      await api('POST', `/api/v1/profiles/${encodeURIComponent(id)}/fingerprint/reset`, { confirm: p.name });
      toast('指纹已重置', 'ok');
      await refreshView({ quiet: true, force: true });
      renderView({ soft: true });
    },
  });
}

/**
 * 后端把文件名放在 X-ZW-Filename 里，且是 **URL 编码**过的（环境名可能是中文），
 * 同时又给了一份 RFC 5987 的 Content-Disposition。两处都要试着解一次，
 * 否则中文环境名会变成一长串 %E5%B0%8F... 直接落到下载文件名上。
 */
function pickFilename(resp, fallback) {
  const direct = resp.headers.get('X-ZW-Filename');
  if (direct) {
    try { return decodeURIComponent(direct); } catch (_) { return direct; }
  }
  const cd = resp.headers.get('Content-Disposition') || '';
  const star = /filename\*=UTF-8''([^;]+)/i.exec(cd);
  if (star) { try { return decodeURIComponent(star[1].trim()); } catch (_) { return star[1]; } }
  const plain = /filename="?([^";]+)"?/i.exec(cd);
  return plain ? plain[1] : fallback;
}

async function exportProfile(id) {
  const p = S.profiles.find((x) => x.id === id) || {};
  const btn = $(`[data-act="export"][data-id="${CSS.escape(id)}"]`);
  if (btn) btn.classList.add('loading');
  try {
    // 主密码必须显式带上：导出包是用它加密的，而服务端进程不一定有 ZW_SYNC_PASSWORD
    // （Windows 上一键部署会写进 .env，但不该假设总在）。用户在同步页填过就复用。
    let usePw = (S.syncPw || (($('#sync-pw') || {}).value) || localStorage.getItem('zw_sync_pw') || '');
    if (!usePw) {
      const typed = await askText({
        title: '导出需要主密码',
        label: '主密码',
        password: true,
        placeholder: '与同步用的是同一个主密码',
        hint: '导出包用它加密，导入时必须输入同一个。本次只在内存里用，不写 localStorage。',
        okLabel: '导出',
      });
      if (typed === null) { if (btn) btn.classList.remove('loading'); return; }
      usePw = typed.trim();
      if (usePw) S.syncPw = usePw;   // 本次会话内复用，别让用户反复输
    }
    const resp = await api('POST', `/api/v1/profiles/${encodeURIComponent(id)}/export`,
      usePw ? { password: usePw } : {}, { raw: true });
    const blob = await resp.blob();
    const fname = pickFilename(resp, `${p.name || 'profile'}.zwp`);
    downloadBlob(blob, fname);
    toast(`${p.name || '环境'} 已导出`, 'ok', { detail: `${fname} · ${fmtBytes(blob.size)}` });
  } catch (e) {
    // EXPORT_DISABLED 是后端明确拒绝（环境正在启动/停止），说清楚多久后再试
    if (e.code === 'EXPORT_DISABLED') {
      toast('现在不能导出', 'pending', { code: e.code, hint: '环境正在启动或停止，等状态稳定（运行中或已停止）再导出。' });
    } else if (e.code === 'EPHEMERAL_PROTECTED') {
      toast('临时环境禁止导出', 'pending', { code: e.code, hint: 'ephemeral=true 的环境不落盘登录态，因此没有可导出的内容。' });
    } else { toastErr(e, '导出失败'); }
  } finally { if (btn) btn.classList.remove('loading'); }
}

function openImport() {
  openDialog({
    title: '导入环境',
    sub: '上传另一个 core 导出的包',
    body: `<div class="notice info mb3"><span class="nic">ⓘ</span><div>导入包自带指纹与 cookie。跨机搬运登录态请优先用「同步」而不是导入：同步会走加密快照与 CAS，不会静默覆盖别人的版本。</div></div>
      <div class="field mb3"><label>选择 .zwpkg 文件</label><input class="input" type="file" id="im-file" style="height:auto;padding:5px 8px"></div>
      <div class="field"><label>包密码（如果导出时设了）</label><input class="input mono" type="password" id="im-pass" placeholder="可留空"></div>`,
    footer: `<div class="grow"></div><button class="btn sm" data-act="dlg-close">取消</button><button class="btn sm primary" id="im-go">导入</button>`,
    onMount(root) {
      $('#im-go', root).addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        const f = ($('#im-file', root).files || [])[0];
        if (!f) { toast('先选一个文件', 'err'); return; }
        btn.classList.add('loading');
        try {
          const buf = await f.arrayBuffer();
          const pass = $('#im-pass', root).value;
          const resp = await fetch('/api/v1/profiles/import' + (pass ? '?password=' + encodeURIComponent(pass) : ''), {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/octet-stream' }, S.token ? { Authorization: 'Bearer ' + S.token } : {}),
            body: buf,
          });
          const ct = resp.headers.get('content-type') || '';
          const data = ct.includes('json') ? await resp.json() : null;
          if (!resp.ok || (data && data.ok === false)) {
            const code = (data && data.code) || 'HTTP_' + resp.status;
            const msg = (data && data.message) || `HTTP ${resp.status}`;
            const todo = isEndpointMissing(resp.status, code);
            toast(todo ? '导入功能待后端就绪' : '导入失败：' + msg, todo ? 'pending' : 'err', { code, hint: data && data.hint });
            btn.classList.remove('loading');
            return;
          }
          toast(`已导入 ${(data && data.data && data.data.name) || '环境'}`, 'ok');
          closeDialog();
          await refreshView({ quiet: true, force: true });
          renderView({ soft: true });
        } catch (e) { toastErr(e, '导入失败'); btn.classList.remove('loading'); }
      });
    },
  });
}

async function clearCookies(ids) {
  let ok = 0; const errs = [];
  for (const id of ids) {
    try { await api('POST', `/api/v1/profiles/${encodeURIComponent(id)}/cookies/clear`, { start_if_needed: true }); ok++; }
    catch (e) {
      if (e.todo) { errs.push('接口待后端就绪 (cookies/clear)'); break; }
      errs.push(`${id.slice(0, 8)}: ${e.message}`);
    }
  }
  if (ok) toast(`已清空 ${ok} 个环境的 cookie`, 'ok');
  if (errs.length) toast('部分失败', 'pending', { detail: errs.join('\n') });
}

async function maintenanceOp(op) {
  if (op === 'trim') {
    try {
      const r = await api('POST', '/api/v1/maintenance/trim');
      toast(`清理完成：${r.profiles ?? 0} 个环境，释放 ${r.freed_human || fmtBytes(r.freed_bytes)}`, 'ok');
      await refreshView({ quiet: true, force: true });
      renderView({ soft: true });
    } catch (e) { toastErr(e, '清理缓存失败'); }
    return;
  }
  if (op === 'cleanup') {
    try {
      const r = await api('POST', '/api/v1/maintenance/cleanup');
      // 四个计数字段各自含义不同，全列出来才知道这次到底动了什么、没动什么
      const items = [
        ['staging_removed', '清掉的 staging 目录', r.staging_removed],
        ['tokens_purged', '回收的过期 CDP 令牌', r.tokens_purged],
        ['auth_ext_removed', '清掉的代理认证扩展', r.auth_ext_removed],
        ['audit_pruned', '裁剪的审计记录', r.audit_pruned],
      ];
      const total = items.reduce((a, [, , v]) => a + (Number(v) || 0), 0);
      S.ops.cleanup = r;   // 同上：留在状态树里，toast 消失后面板还在
      if (S.view === 'ops') renderView({ soft: true });
      toast(total ? `清理完成，共处理 ${total} 项` : '没有需要清理的东西', total ? 'ok' : 'pending', {
        detail: items.map(([k, label, v]) => `${label}：${v ?? 0}`).join('\n'),
        hint: items.map(([k]) => k).join(' / '),
      });
    } catch (e) { toastErr(e, '清理失败'); }
    return;
  }
  if (op === 'reap') {
    // 当前后端把"扫描"和"杀"做在同一个 POST 里，所以没法先看清单再决定。
    // 与其假装能预览，不如把这件事说清楚，让用户在真的知道后果之后再确认。
    confirmDanger({
      title: '清理孤儿浏览器进程',
      tone: 'bad',
      sub: '会结束本机没有环境认领的 chrome 进程',
      body: `orphan 指的是 core 重启后遗留、数据库里已经没有对应环境在运行的浏览器进程。
        它们会一直占着端口和内存。<br><br>
        <b>注意</b>：后端这个接口是「扫描 + 清理」一体的，点下去就会直接结束进程，不会先给清单。
        清理完的 pid 与原因会在结果里列出来。确认文字：<span class="mono">REAP</span>`,
      confirmText: 'REAP',
      okLabel: '扫描并清理',
      async action() {
        const r = await api('POST', '/api/v1/maintenance/reap-orphans');
        const killed = r.killed || [];
        const det = r.details || [];
        if (!killed.length) {
          toast(`扫描 ${r.scanned ?? 0} 个浏览器进程，没有孤儿`, 'ok');
          return;
        }
        toast(`已清理 ${killed.length} 个孤儿进程`, 'ok', {
          detail: det.map((d) => `pid ${d.pid} · ${d.profile_id || '—'} · ${d.reason || ''}`).join('\n') || `pids: ${killed.join(', ')}`,
        });
        await refreshView({ quiet: true, force: true });
        renderView({ soft: true });
      },
    });
  }
}

async function runDoctor() {
  const box = $('#doctor-box');
  if (box) box.innerHTML = `<div class="row"><span class="spin"></span><span class="faint fs12">检查中…</span></div>`;
  try {
    const d = await api('POST', '/api/v1/maintenance/doctor');
    const checks = d.checks || [];
    const bad = checks.filter((c) => !c.ok).length;
    // 结果落状态而不是只贴 DOM：下一轮轮询重画时才能保住，不然 8 秒后就变回"点运行自检"
    S.ops.doctor = { checks, all_ok: !!d.all_ok, at: Date.now() / 1000 };
    S.ops.doctorOpen = {};
    if (S.view === 'ops') renderView({ soft: true });
    else if (box) box.innerHTML = doctorHtml();
    if (!d.all_ok) toast(`自检有 ${bad} 项异常`, 'pending', { hint: '点各行展开看具体值。' });
    else toast('自检全部通过', 'ok');
  } catch (e) {
    S.ops.doctor = { error: e.message + (e.hint ? `（${e.hint}）` : '') };
    if (S.view === 'ops') renderView({ soft: true });
    else if (box) box.innerHTML = doctorHtml();
    toastErr(e, '自检失败');
  }
}

async function pushAll() {
  const pw = await syncPassword();
  if (!pw) return;
  // 契约把路径从 /sync/all/push 改成了 /sync/push-all；后端可能还在旧路径上，两个都试
  const paths = ['/api/v1/sync/push-all', '/api/v1/sync/all/push'];
  let lastErr = null;
  for (const p of paths) {
    try {
      const r = await api('POST', p, { password: pw });
      toast('全量推送完成', 'ok', { detail: jsonBrief(r, 260) });
      await loadSync(true);
      renderView({ soft: true });
      return;
    } catch (e) {
      lastErr = e;
      if (!e.todo) break;   // 不是 404，就没必要换路径重试

}

async function pageAction(kind) {
  const ref = S.data.profile;
  const d = S.data;
  try {
    if (kind === 'nav') {
      const url = ($('#d-url') || {}).value || '';
      if (!url) { toast('先填一个网址', 'err'); return; }
      const r = await api('POST', '/api/v1/page/navigate', { profile: ref, url, new_tab: !!($('#d-newtab') || {}).checked });
      toast('已导航', 'ok', { detail: `${r.title || ''} ${r.url || ''}`.trim() });
    } else if (kind === 'text') {
      const r = await api('GET', `/api/v1/page/text?profile=${encodeURIComponent(ref)}`);
      d.text = r.text || '（空）';
      renderView({ soft: true });
    } else if (kind === 'eval') {
      const expr = ($('#d-expr') || {}).value || '';
      if (!expr.trim()) { toast('表达式为空', 'err'); return; }
      d.expr = expr;
      const r = await api('POST', '/api/v1/page/evaluate', { profile: ref, expression: expr });
      d.evalResult = r.result;
      renderView({ soft: true });
      toast('已执行', 'ok');
    } else if (kind === 'targets') {
      const r = await api('GET', `/api/v1/page/targets?profile=${encodeURIComponent(ref)}`);
      d.targets = r.targets || [];
      renderView({ soft: true });
    } else if (kind === 'shot') {
      const resp = await api('POST', '/api/v1/page/screenshot', { profile: ref, format: 'png' }, { raw: true });
      const blob = await resp.blob();
      if (d.shot) URL.revokeObjectURL(d.shot);
      d.shot = URL.createObjectURL(blob);
      renderView({ soft: true });
      toast('已截图', 'ok');
    }
  } catch (e) {
    // 截图/文本会顺手启动环境，失败原因往往是"内核不可用"，把 hint 带出来
    toastErr(e, { nav: '导航失败', text: '取文字失败', eval: '执行失败', targets: '列标签页失败', shot: '截图失败' }[kind]);
  }
}
