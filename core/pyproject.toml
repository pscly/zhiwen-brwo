[project]
name = "zw-core"
version = "0.7.81"
description = "知纹核心（zhiwen core）—— 指纹浏览器机群的编排层、CDP 网关与同步客户端"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  # socks5 代理的出口检测需要它，不装的话 check_egress 只会回
  # "本机缺少 socks 支持" —— 而 socks5 正是最常用的代理类型。
  "httpx[socks]>=0.27,<1",
  "pynacl>=1.5,<2",
  "argon2-cffi>=23.1,<24",
  "zstandard>=0.23,<0.24",
  "websockets>=13,<14",
  # Windows 上 Python 没有系统时区数据库，ZoneInfo("Asia/Shanghai") 会抛
  # ZoneInfoNotFoundError —— 用户填时区会被误判为"不认识的时区"。
  # Linux/macOS 上这个包是空转（有系统库），装了无害。
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
zw = "zw_core.cli:main"
zw-client = "zw_core.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zw_core"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
asyncio_mode = "auto"
