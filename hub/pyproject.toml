[project]
name = "zw-hub"
version = "0.1.0"
description = "知纹同步中心（zhiwen sync hub）—— 局域网内托管加密 profile 快照、租约与索引"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
zw-hub = "zw_hub.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zw_hub"]
