[project]
name = "zw-hub"
version = "0.7.89"
description = "知纹同步中心（zhiwen sync hub）—— 局域网内托管加密 profile 快照、租约与索引"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  # 代理库要把密码加密存在服务器上（用户要求"服务器加了代理、用户机也能用"），
  # 用 PyNaCl 做 XSalsa20-Poly1305。**这个依赖漏过一次**：本地 venv 里有、
  # 镜像里没有，于是 3.5 上的 /v1/proxies 直接 500（ModuleNotFoundError: nacl）。
  "pynacl>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
zw-hub = "zw_hub.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zw_hub"]
