# 知纹同步中心 · 部署在 192.168.3.5
# 用法：
#   cd hub && docker compose up -d
#   日志：docker compose logs -f
name: zw-hub

services:
  hub:
    build: .
    image: zw-hub:0.7.8
    # 目标机器上可能没有外网（或很慢）。镜像由 deploy 脚本用
    # docker save/load 送过去，所以这里禁止 compose 去 registry 拉。
    pull_policy: never
    container_name: zw-hub
    restart: unless-stopped
    ports:
      # 绑内网地址（给局域网用）+ 回环（给"本机脚本/排错"用）。
      # 只绑内网地址时，在 3.5 上 `curl 127.0.0.1:8700` 会连不上 ——
      # 这会让部署脚本的"自检"和日常排错都误判成"服务没起来"。
      - "192.168.3.5:8700:8700"
      - "127.0.0.1:8700:8700"
    volumes:
      - /srv/zw-hub/data:/data
    environment:
      ZW_DATA_DIR: /data
      ZW_HUB_PORT: "8700"
      # 可选：留空 = 不要对接码（默认）。
      # 留空时准入靠设备注册表：每台电脑都要注册，服务器端可按机器码踢下线。
      # 想更严就取消 .env 里的注释并填一串随机值，客户端会出现"对接码"输入框。
      ZW_HUB_TOKEN: ${ZW_HUB_TOKEN:-}
      ZW_KEEP_REVISIONS: "10"
      ZW_LEASE_TTL: "90"
      ZW_MAX_BLOB_BYTES: "268435456"
      ZW_LOG_LEVEL: "INFO"
      # 局域网内简单完整性校验：默认关闭，需要时设 true 并配 secret
      # 管理面板登录（可用 .env 覆盖）
      ZW_PANEL_USER: ${ZW_PANEL_USER:-admin}
      ZW_PANEL_PASSWORD: ${ZW_PANEL_PASSWORD:-1234}
      # 新设备自动放行：客户端只填 IP 就能用
      ZW_DEVICE_AUTO_APPROVE: ${ZW_DEVICE_AUTO_APPROVE:-false}
      # 来源网段白名单。**必须在这里透传**：只写进 .env 没用 ——
      # compose 的 environment 是一份显式清单，没列出来的变量不会进容器。
      # 这个坑真踩过：.env 里设了 192.168.3.0/24，容器里却读不到，
      # 白名单等于没开，而界面上看不出异常。
      ZW_ALLOWED_CIDRS: ${ZW_ALLOWED_CIDRS:-}
      # 远程命令行（设备拉取队列）的总开关与上限
      ZW_SHELL_ENABLED: ${ZW_SHELL_ENABLED:-true}
      ZW_SHELL_MAX_OUTPUT: ${ZW_SHELL_MAX_OUTPUT:-65536}
      ZW_SHELL_QUEUE_LIMIT: ${ZW_SHELL_QUEUE_LIMIT:-200}
      ZW_REQUIRE_SIGNATURE: "false"
      ZW_SIGNATURE_SECRET: ${ZW_SIGNATURE_SECRET:-}
      TZ: Asia/Hong_Kong
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8700/healthz',timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
