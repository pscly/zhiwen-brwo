<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知纹 · 服务器端管理</title>
<style>
  .banner{background:#4a2f0f;color:#ffd08a;border:1px solid #8a5a1a;border-radius:10px;
    padding:10px 14px;margin:0 auto 14px;max-width:1100px;font-size:13px;line-height:1.6}
  .banner code{background:#2a1c08;padding:1px 5px;border-radius:4px;font-size:12px}
  :root{
    --bg:#0b0d12; --ink:#e8ebf2; --ink-2:#a8b0c0; --ink-3:#6f7889;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --glass:rgba(22,26,34,.72); --glass-2:rgba(30,35,45,.62);
    --accent:#5b9dff; --ok:#3ecf8e; --warn:#ffb020; --bad:#ff6b6b;
    --r:14px; --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    --sh:0 10px 30px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.22);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef1f6; --ink:#111722; --ink-2:#4a5567; --ink-3:#7b8798;
      --line:rgba(12,20,32,.10); --line-2:rgba(12,20,32,.18);
      --glass:rgba(255,255,255,.82); --glass-2:rgba(255,255,255,.66);
      --sh:0 12px 32px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.06);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    background:
      radial-gradient(1100px 520px at 12% -10%, rgba(91,157,255,.16), transparent 62%),
      radial-gradient(900px 460px at 92% 6%, rgba(62,207,142,.10), transparent 58%),
      var(--bg);
    font:14px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .glass{background:var(--glass); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--sh), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(26px) saturate(160%); -webkit-backdrop-filter:blur(26px) saturate(160%)}
  /* ── 登录 ───────────────────────────────────────── */
  #login{min-height:100vh; display:grid; place-items:center; padding:24px}
  .login-card{width:min(400px,94vw); padding:30px 28px}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:20px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#6fb0ff,#3b6fe0);
    display:grid;place-items:center;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(59,111,224,.4)}
  .brand b{font-size:16px;letter-spacing:.3px}
  .brand span{font-size:11px;color:var(--ink-3);display:block;margin-top:-2px}
  label{display:block;font-size:11.5px;color:var(--ink-2);margin:14px 0 6px;letter-spacing:.3px}
  input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);
    background:rgba(0,0,0,.20); color:var(--ink); font:inherit; font-family:var(--mono); font-size:13px}
  @media (prefers-color-scheme: light){ input{background:rgba(255,255,255,.8)} }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.16)}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line-2);
    background:var(--glass-2);color:var(--ink);padding:9px 15px;transition:.16s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:linear-gradient(180deg,#5fa2ff,#3f7fe8);border-color:transparent;color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.07);color:#fff}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  button.sm{padding:5px 10px;font-size:12px}
  .btn-block{width:100%;margin-top:20px;padding:11px}
  .err{color:var(--bad);font-size:12.5px;margin-top:12px;min-height:18px}
  .shake{animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  /* ── 主界面 ─────────────────────────────────────── */
  #app{display:none; min-height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:14px 24px;
    border-bottom:1px solid var(--line);background:var(--glass);
    backdrop-filter:blur(22px);position:sticky;top:0;z-index:5}
  header h1{font-size:14.5px;margin:0;font-weight:640;letter-spacing:.3px}
  header .sub{font-size:11px;color:var(--ink-3);margin-left:2px}
  .grow{flex:1}
  main{padding:22px 24px 60px;max-width:1180px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{padding:14px 16px}
  .kpi b{display:block;font-size:24px;font-weight:680;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px;color:var(--ink-3)}
  .card{padding:16px 18px;margin-bottom:16px}
  .card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .card-h h2{font-size:12px;margin:0;color:var(--ink-3);font-weight:620;letter-spacing:.9px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;color:var(--ink-3);font-weight:560;padding:8px 10px;
    border-bottom:1px solid var(--line);letter-spacing:.4px;white-space:nowrap}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:rgba(255,255,255,.035)}
  .mono{font-family:var(--mono);font-size:12px}
  .dim{color:var(--ink-3)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
  .dot.off{background:var(--ink-3)}
  .dot.rev{background:var(--bad);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
    border:1px solid var(--line-2);color:var(--ink-2)}
  .badge.ok{color:var(--ok);border-color:rgba(62,207,142,.4);background:rgba(62,207,142,.10)}
  .badge.bad{color:var(--bad);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.10)}
  .badge.warn{color:var(--warn);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.10)}
  .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .empty{padding:34px;text-align:center;color:var(--ink-3);font-size:13px}
  #toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .tmsg{padding:10px 14px;border-radius:10px;font-size:13px;max-width:420px;
    background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--accent);box-shadow:var(--sh)}
  .tmsg.ok{border-left-color:var(--ok)} .tmsg.err{border-left-color:var(--bad)}
  dialog{border:1px solid var(--line-2);border-radius:16px;padding:0;color:var(--ink);
    background:var(--glass);box-shadow:var(--sh);width:min(460px,92vw);
    backdrop-filter:blur(28px) saturate(160%)}
  @media (prefers-color-scheme: light){ dialog{background:#fff} }
  dialog::backdrop{background:rgba(4,7,12,.6);backdrop-filter:blur(3px)}
  .dlg-h{padding:18px 20px 8px;font-weight:620;font-size:15px}
  .dlg-b{padding:6px 20px 14px;font-size:13px;color:var(--ink-2)}
  .dlg-f{display:flex;justify-content:flex-end;gap:9px;padding:12px 20px;border-top:1px solid var(--line)}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.65}
  .kpi b.warn{color:var(--warn)}
  code{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px}
  /* ── 远程终端 ───────────────────────────────────── */
  .term-row td{padding:10px;background:rgba(0,0,0,.16);border-bottom:1px solid var(--line)}
  tbody tr.term-row:hover td{background:rgba(0,0,0,.16)}
  @media (prefers-color-scheme: light){
    .term-row td, tbody tr.term-row:hover td{background:rgba(12,20,32,.035)}
  }
  .term{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;
    background:rgba(0,0,0,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  @media (prefers-color-scheme: light){ .term{background:#fff} }
  .term-h{display:flex;align-items:center;gap:9px;padding:9px 12px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:var(--glass-2)}
  .term-title{font-size:12.5px;font-weight:600;letter-spacing:.2px}
  .term-sub{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .term-warn{padding:8px 12px;font-size:11.5px;line-height:1.7;color:var(--warn);
    border-bottom:1px solid var(--line);background:rgba(255,176,32,.08)}
  .term-out{max-height:340px;overflow:auto;padding:10px 12px;font-family:var(--mono);
    font-size:12.5px;line-height:1.62;white-space:pre-wrap;word-break:break-word;
    overscroll-behavior:contain}
  /* 条目内部要 normal：否则会继承上面的 pre-wrap，把模板缩进渲染成空行 */
  .term-entry{padding:7px 0;border-bottom:1px dashed var(--line);white-space:normal}
  .term-entry:last-child{border-bottom:none;padding-bottom:2px}
  .term-cmd{color:var(--accent);font-weight:560;white-space:pre-wrap;word-break:break-word}
  .term-stdout{margin-top:3px;white-space:pre-wrap;word-break:break-word}
  .term-stderr{margin-top:3px;white-space:pre-wrap;word-break:break-word;color:#ff8b8b}
  @media (prefers-color-scheme: light){ .term-stderr{color:#b3261e} }
  .term-note{margin-top:4px;font-size:11.5px;color:var(--ink-3)}
  .term-note.bad{color:var(--bad)}
  .term-meta{margin-top:4px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .term-meta.bad{color:var(--bad);font-weight:640}
  .term-cut{margin-top:4px;font-size:11px;color:var(--warn)}
  .term-hint{font-size:11.5px;color:var(--ink-3);line-height:1.75}
  .term-in{display:flex;gap:8px;align-items:center;padding:10px 12px;
    border-top:1px solid var(--line);background:var(--glass-2)}
  .term-in input{flex:1;min-width:0;font-size:12.5px}
  .term-in input:disabled{opacity:.55;cursor:not-allowed}
  .term-in button{white-space:nowrap}
</style>
</head>
<body>

<!-- 默认凭据提醒（仍在用 admin/1234 时显示） -->
<div id="warnDefault" class="banner" hidden>
  正在使用默认账号密码（admin / 1234），任何人都能登进来。改法：编辑服务器上的
  <code>.env</code>，设置 <code>ZW_PANEL_USER</code> 与 <code>ZW_PANEL_PASSWORD</code>，
  再执行 <code>docker compose up -d</code>。
</div>

<!-- 登录层 -->
<div id="login">
  <form class="glass login-card" id="login-form" autocomplete="off">
    <div class="brand">
      <div class="logo">知</div>
      <div><b>知纹 · 服务器端</b><span>设备与同步中心管理</span></div>
    </div>
    <label>登录名</label>
    <input id="u" name="username" autocomplete="username" required>
    <label>密码</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="login-err"></div>
    <button class="primary btn-block" type="submit">登录</button>
    <div class="hint">这是你自己服务器的管理面板。忘记密码就看部署机上 <code>/opt/zhiwen-hub/.env</code> 里的 ZW_PANEL_PASSWORD。</div>
  </form>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <div class="logo" style="width:26px;height:26px;border-radius:7px;font-size:12px">知</div>
    <h1>服务器端管理</h1>
    <span class="sub" id="hub-ver"></span>
    <div class="grow"></div>
    <span class="dim" style="font-size:11.5px" id="refresh-hint"></span>
    <button class="sm" id="btn-refresh">刷新</button>
    <button class="sm" id="btn-logout">退出</button>
  </header>
  <main>
    <div class="kpis" id="kpis"></div>

    <div class="glass card">
      <div class="card-h">
        <h2>已连接过的电脑</h2>
        <div class="grow"></div>
        <span class="dim" style="font-size:11.5px">机器码由客户端首次启动时生成，删配置才会变</span>
      </div>
      <div style="overflow:auto">
        <table>
          <thead><tr>
            <th style="min-width:170px">设备</th><th>状态</th><th>本机环境</th><th>平台</th>
            <th>最近在线</th><th>IP</th><th class="mono">机器码</th><th style="text-align:right">操作</th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="empty">读取中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="glass card">
      <div class="card-h"><h2>最近事件</h2><div class="grow"></div>
        <span class="dim" style="font-size:11.5px">谁注册了、谁被踢了</span></div>
      <div id="events" class="mono dim" style="font-size:12px;line-height:1.9;max-height:260px;overflow:auto">读取中…</div>
    </div>
  </main>
</div>

<div id="toast"></div>

<dialog id="dlg">
  <div class="dlg-h" id="dlg-title">确认</div>
  <div class="dlg-b" id="dlg-body"></div>
  <div class="dlg-f">
    <button class="sm" id="dlg-cancel">取消</button>
    <button class="sm danger" id="dlg-ok">确认</button>
  </div>
</dialog>

<script>
'use strict';
const API = '';
let devices = [];
let timer = null;

function toast(msg, kind){
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'tmsg ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = '.4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); },
             kind === 'err' ? 6500 : 3000);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtAgo(sec){
  if (sec == null) return '—';
  if (sec < 10) return '刚刚';
  if (sec < 60) return sec + ' 秒前';
  if (sec < 3600) return Math.floor(sec / 60) + ' 分钟前';
  if (sec < 86400) return Math.floor(sec / 3600) + ' 小时前';
  return Math.floor(sec / 86400) + ' 天前';
}

async function api(method, path, body){
  const opt = { method, headers: {}, credentials: 'same-origin' };
  if (body !== undefined){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(API + path, opt);
  let data = null;
  try { data = await r.json(); } catch (_) { data = { ok: false, code: 'BAD_RESPONSE', message: '返回不是 JSON' }; }
  if (r.status === 401 && path !== '/panel/api/login'){
    showLogin('登录已过期，请重新登录');
    throw new Error('未登录');
  }
  if (data && data.ok === false) throw new Error(`[${data.code}] ${data.message}`);
  return data && data.data !== undefined ? data.data : data;
}

function showLogin(msg){
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'grid';
  document.getElementById('login-err').textContent = msg || '';
  if (timer) { clearInterval(timer); timer = null; }
  closeAllTerminals();   // 会话结束，轮询定时器一并清掉
}
function showApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

document.getElementById('login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const errBox = document.getElementById('login-err');
  errBox.textContent = '';
  try {
    await api('POST', '/panel/api/login', { username: u, password: p });
    showApp();
    await boot();
  } catch (e) {
    errBox.textContent = e.message;
    const card = document.querySelector('.login-card');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 320);
  }
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await api('POST', '/panel/api/logout', {}).catch(() => {});
  showLogin('已退出');
});
document.getElementById('btn-refresh').addEventListener('click', () => loadAll(true));

function kvState(d){
  if (d.status === 'revoked') return '<span class="badge bad"><i class="dot rev"></i>已踢下线</span>';
  if (d.online) return '<span class="badge ok"><i class="dot on"></i>在线</span>';
  return '<span class="badge"><i class="dot off"></i>离线</span>';
}

function renderKpis(st){
  const items = [
    ['在线', st.online, '最近 ' + Math.round((st.online_window_seconds || 180) / 60) + ' 分钟内有心跳', ''],
    ['环境总数', st.total_profiles ?? 0, '所有在线设备上报之和', ''],
    ['正在运行', st.total_running ?? 0, '所有在线设备上报之和', ''],
    ['已踢下线', st.revoked, '这些设备现在连不上', ''],
    ['累计设备', st.total, '含已删除前见过的', ''],
  ];
  // shell 是可选字段（旧 hub 不会返回）：没有就不加这张卡，更不允许因此报错。
  const sh = st && st.shell;
  if (sh && typeof sh === 'object'){
    const q = Number(sh.queued || 0);
    const r = Number(sh.running || 0);
    const hint = r > 0 ? `另有 ${r} 条正在设备上执行`
      : (q > 0 ? '等设备来取；设备离线就会一直排队' : '队列是空的');
    items.push(['待执行命令', q, hint, q > 0 ? 'warn' : '']);
  }
  document.getElementById('kpis').innerHTML = items.map(([k, v, hint, cls]) =>
    `<div class="glass kpi"><b class="${esc(cls || '')}">${esc(v)}</b><span>${esc(k)}</span>
      <div class="hint" style="margin-top:2px">${esc(hint)}</div></div>`).join('');
}

/** 本机环境概况。客户端心跳会带 profiles/running；老客户端没有就显示 —。 */
function envCell(d){
  const n = Number(d.profiles || 0);
  const r = Number(d.running || 0);
  if (!n && !r) return '<span class="muted">—</span>';
  const cls = r > 0 ? 'ok' : '';
  const disk = d.disk_human ? `<div class="dim" style="font-size:10.5px">${esc(d.disk_human)}</div>` : '';
  return `<span class="badge ${cls}">${esc(n)} 个 · ${esc(r)} 运行</span>${disk}`;
}

function renderRows(){
  const tb = document.getElementById('rows');
  // 整表重绘会摘掉终端 DOM，这里先记住"谁正在输入、滚到哪了"，重绘后还回去
  const focusId = termFocusId();
  const scrolls = new Map();
  terminals.forEach(t => { if (t.open) scrolls.set(t.id, t.out.scrollTop); });

  if (!devices.length){
    tb.innerHTML = `<tr><td colspan="8" class="empty">还没有任何电脑连过这台服务器。<br>
      <span style="font-size:12px">装好客户端，填上本机地址就能用了。</span></td></tr>`;
    closeAllTerminals();   // 设备没了，终端也就没得看了
    return;
  }
  tb.innerHTML = devices.map(d => {
    const id = esc(d.device_id);
    const revoked = d.status === 'revoked';
    return `<tr data-dev="${id}">
      <td>
        <div style="font-weight:560">${esc(d.label || d.hostname || '未命名设备')}</div>
        <div class="dim" style="font-size:11px">${esc(d.hostname || '')}${d.app_version ? ' · v' + esc(d.app_version) : ''}</div>
      </td>
      <td>${kvState(d)}</td>
      <td class="mono">${envCell(d)}</td>
      <td class="mono dim">${esc(d.platform || '—')}${d.arch ? ' / ' + esc(d.arch) : ''}</td>
      <td class="dim">${esc(fmtAgo(d.last_seen_ago))}</td>
      <td class="mono dim">${esc(d.last_ip || '—')}</td>
      <td class="mono dim" title="${id}">${esc(d.device_id.slice(0, 10))}…</td>
      <td><div class="acts">
        <button class="sm" data-act="term" data-id="${id}">终端</button>
        ${revoked
          ? `<button class="sm" data-act="restore" data-id="${id}">恢复</button>`
          : `<button class="sm danger" data-act="revoke" data-id="${id}">踢下线</button>`}
        <button class="sm" data-act="rename" data-id="${id}">改名</button>
        <button class="sm danger" data-act="delete" data-id="${id}">删除</button>
      </div></td>
    </tr>`;
  }).join('');

  attachTerminals();   // 把开着的终端按 device_id 挂回对应行下方
  scrolls.forEach((top, id) => {
    const t = terminals.get(id);
    if (t && t.open) t.out.scrollTop = top;
  });
  const ft = focusId && terminals.get(focusId);
  if (ft && ft.open) ft.input.focus();
}

function renderEvents(list){
  const box = document.getElementById('events');
  if (!list.length){ box.innerHTML = '<span class="dim">还没有事件。</span>'; return; }
  const map = { enroll: '注册', revoke: '踢下线', restore: '恢复', delete: '删除' };
  box.innerHTML = list.map(e => {
    const t = new Date(e.ts * 1000).toLocaleString('zh-CN', { hour12: false });
    const act = map[e.action] || e.action;
    const who = e.actor ? ` by ${esc(e.actor)}` : '';
    return `<div><span class="dim">${esc(t)}</span>  <b>${esc(act)}</b>${who}  <span class="dim mono">${esc((e.device_id || '').slice(0, 10))}</span></div>`;
  }).join('');
}

async function loadAll(showToast){
  try {
    const [st, list, ev] = await Promise.all([
      api('GET', '/panel/api/stats'),
      api('GET', '/panel/api/devices'),
      api('GET', '/panel/api/events?limit=40'),
    ]);
    renderKpis(st);
    devices = list.devices || [];
    renderRows();
    renderEvents(ev.events || []);
    document.getElementById('refresh-hint').textContent = '已更新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    if (showToast) toast('已刷新', 'ok');
  } catch (e) {
    if (e.message !== '未登录') toast(e.message, 'err');
  }
}

document.getElementById('rows').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act;
  if (!act) return;   // 终端面板里的按钮走自己的监听，别在这里当成设备操作
  const id = btn.dataset.id;
  const dev = devices.find(x => x.device_id === id) || {};
  const name = dev.label || dev.hostname || id.slice(0, 10);

  if (act === 'term'){
    // 已经开着就聚焦过去，不再开第二个
    openTerminal(id);
  } else if (act === 'revoke'){
    askConfirm(`把「${name}」踢下线？`, '踢下线后这台电脑立即连不上服务器，它的同步与注册请求都会返回 403 DEVICE_REVOKED。随时可以点「恢复」放回来。', async () => {
      await api('POST', `/panel/api/devices/${encodeURIComponent(id)}/revoke`, { note: '面板手动踢下线' });
      toast(`${name} 已踢下线`, 'ok');
      await loadAll();
    });
  } else if (act === 'restore'){
    await api('POST', `/panel/api/devices/${encodeURIComponent(id)}/restore`, {});
    toast(`${name} 已恢复`, 'ok');
    await loadAll();
  } else if (act === 'rename'){
    askText(`给设备改名`, '只影响面板显示，不影响那台电脑', dev.label || '', async (v) => {
      if (!v.trim()) return;
      await api('PATCH', `/panel/api/devices/${encodeURIComponent(id)}`, { label: v.trim() });
      await loadAll();
    });
  } else if (act === 'delete'){
    askConfirm(`删除设备记录「${name}」？`, '只删服务器上的记录。那台电脑下次启动会作为"新设备"重新出现（因为它的机器码还在本地）。想永久禁止，用踢下线。', async () => {
      await api('DELETE', `/panel/api/devices/${encodeURIComponent(id)}`, {});
      toast('已删除', 'ok');
      await loadAll();
    });
  }
});

/* ── 小弹窗 ─────────────────────────────────────── */

}

    <input id="dlg-input" value="${esc(initial || '')}" style="width:100%">`, onOk);
  setTimeout(() => {

document.getElementById('dlg-cancel').addEventListener('click', () => document.getElementById('dlg').close());
document.getElementById('dlg-ok').addEventListener('click', async () => {

/* ── 远程终端（协议：docs/13-远程命令行协议.md）───────────────
   投递 POST /v1/devices/{id}/shell                  → {job_id, status}
   轮询 GET  /v1/devices/{id}/shell/{job_id}?wait=25 → 直到终态
   历史 GET  /v1/devices/{id}/shell/history?limit=20
   取消 POST /v1/devices/{id}/shell/{job_id}/cancel
   三条硬约定：
   1) 表格每 10 秒整表重绘，终端节点由 terminals 持有，重绘后原样挂回 ——
      输出、滚动位置、输入框里还没发出去的命令都不会丢。
   2) 设备与服务器来的文本一律 esc() / textContent：命令输出里可能有 <script>。
   3) 每条命令一条轮询链；关终端、退出登录、关页面都清定时器。
*/
const TERM_HISTORY_LIMIT = 20;     // 打开时回显最近多少条
const TERM_WAIT_SECONDS = 25;      // 服务端长轮询秒数（协议上限 30）
const TERM_MAX_WAIT_MS = 120000;   // 前端兜底：最多等 120 秒
const TERM_POLL_GAP_MS = 200;      // 两轮轮询之间的间隔
const TERM_RENDER_CAP = 20000;     // 单条输出最多渲染多少字符（20 条历史才不至于卡住）
const TERM_FINAL = ['done', 'error', 'timeout', 'canceled', 'expired'];
const TERM_PLACEHOLDER = '输入命令，回车执行（↑/↓ 翻历史）';

const terminals = new Map();       // device_id -> 终端对象
const localCmdHistory = [];        // 本浏览器执行过的命令，↑/↓ 翻

function encSeg(s){ return encodeURIComponent(String(s == null ? '' : s)); }
function fmtMs(n){
  const v = Number(n);
  if (!Number.isFinite(v)) return '—';
  return v < 1000 ? Math.round(v) + ' ms' : (v / 1000).toFixed(2) + ' 秒';
}
function termScrollToEnd(t){ try { t.out.scrollTop = t.out.scrollHeight; } catch (_) {} }
function termSleep(t, ms){
  return new Promise(resolve => {
    t.timerResolve = resolve;
    t.timer = setTimeout(() => { t.timer = null; t.timerResolve = null; resolve(); }, ms);
  });
}
function clearTermTimer(t){
  if (t.timer){ clearTimeout(t.timer); t.timer = null; }
  if (t.timerResolve){ const r = t.timerResolve; t.timerResolve = null; r(); }
}
function termDeviceName(d, id){
  return (d && (d.label || d.hostname)) || String(id || '').slice(0, 10) || '未命名设备';
}
function termFocusId(){
  const a = document.activeElement;
  return a && a.dataset && a.dataset.term === 'input' ? a.dataset.termDevice : null;
}

function makeTerminal(dev){
  const id = dev.device_id;
  const row = document.createElement('tr');
  row.className = 'term-row';
  const cell = document.createElement('td');
  cell.colSpan = 8;               // 与设备表 8 列对齐
  row.appendChild(cell);

  const root = document.createElement('div');
  root.className = 'term';
  root.innerHTML = `
    <div class="term-h">
      <div class="term-title">远程终端 · <b>${esc(termDeviceName(dev, id))}</b></div>
      <span class="term-sub">${esc(String(id || '').slice(0, 12))}…</span>
      <div class="grow"></div>
      <span class="badge term-flag" data-term="flag">命令行：—</span>
      <button class="sm" data-term="close">关闭</button>
    </div>
    <div class="term-warn" data-term="warn" hidden></div>
    <div class="term-out" data-term="out" role="log"></div>
    <div class="term-in">
      <input data-term="input" data-term-device="${esc(id)}" autocomplete="off" spellcheck="false"
             placeholder="${esc(TERM_PLACEHOLDER)}" aria-label="远程命令输入框">
      <button class="sm primary" data-term="run">执行</button>
      <button class="sm" data-term="cancel" disabled>取消</button>
    </div>`;
  cell.appendChild(root);

  const q = sel => root.querySelector(`[data-term="${sel}"]`);
  const t = {
    id, dev, row, root, open: true, closed: false,
    out: q('out'), input: q('input'), runBtn: q('run'), cancelBtn: q('cancel'),
    flag: q('flag'), warn: q('warn'), titleB: root.querySelector('.term-title b'),
    busy: false, jobId: null, pollToken: null, timer: null, timerResolve: null,
    histIdx: localCmdHistory.length, current: null, startedAt: 0,
  };
  q('close').addEventListener('click', () => closeTerminal(t));
  t.runBtn.addEventListener('click', () => runCommand(t));
  t.cancelBtn.addEventListener('click', () => cancelJob(t));
  t.input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter'){ ev.preventDefault(); runCommand(t); }
    else if (ev.key === 'ArrowUp'){ ev.preventDefault(); histStep(t, -1); }
    else if (ev.key === 'ArrowDown'){ ev.preventDefault(); histStep(t, 1); }
  });
  t.input.addEventListener('input', () => { t.histIdx = localCmdHistory.length; });
  return t;
}

/** 把设备上报的开关/在线状态映射到终端界面（设备每 10 秒刷新一次，这里同步跟着更新）。 */
function syncTerminalChrome(t){
  const d = t.dev || {};
  t.titleB.textContent = termDeviceName(d, t.id);
  const on = d.shell_enabled;
  if (on === true){ t.flag.className = 'badge term-flag ok'; t.flag.textContent = '命令行：开'; }
  else if (on === false){ t.flag.className = 'badge term-flag bad'; t.flag.textContent = '命令行：关'; }
  else { t.flag.className = 'badge term-flag'; t.flag.textContent = '命令行：未知'; }

  const off = on === false;
  t.input.disabled = off;
  t.input.placeholder = off ? '这台电脑的远程命令行已关闭（在客户端里打开）' : TERM_PLACEHOLDER;
  t.runBtn.disabled = off || t.busy;

  const notes = [];
  if (d.status === 'revoked') notes.push('这台设备已被踢下线，命令会被服务器拒绝；先在列表里点「恢复」。');
  else if (!d.online) notes.push('设备离线，命令会在它上线后执行。');
  if (off) notes.push('这台电脑的远程命令行已关闭（在客户端里打开）。');
  t.warn.innerHTML = notes.map(n => `<div>${esc(n)}</div>`).join('');
  t.warn.hidden = !notes.length;
}

function openTerminal(id){
  const exist = terminals.get(id);
  if (exist && exist.open){ focusTerminal(exist); return; }   // 别开第二个，聚焦已有的
  const dev = devices.find(d => d.device_id === id) || { device_id: id };
  const t = makeTerminal(dev);
  terminals.set(id, t);
  syncTerminalChrome(t);
  renderRows();          // 重绘后 attachTerminals 会把终端行挂到设备行下方
  t.input.focus();
  loadTermHistory(t);
}

function focusTerminal(t){
  try { t.row.scrollIntoView({ block: 'nearest' }); } catch (_) {}
  t.input.focus();
  if (typeof t.root.animate === 'function'){
    t.root.animate([
      { boxShadow: '0 0 0 2px rgba(91,157,255,0)' },
      { boxShadow: '0 0 0 2px rgba(91,157,255,.55)' },
      { boxShadow: '0 0 0 2px rgba(91,157,255,0)' },
    ], { duration: 700 });
  }
}

function closeTerminal(t){
  t.open = false;
  t.closed = true;
  t.pollToken = null;
  clearTermTimer(t);
  if (t.row && t.row.parentNode) t.row.parentNode.removeChild(t.row);
  terminals.delete(t.id);
}
function closeAllTerminals(){
  [...terminals.values()].forEach(t => { try { closeTerminal(t); } catch (_) {} });
}
window.addEventListener('beforeunload', closeAllTerminals);

/** 整表重绘之后把还在开着的终端挂回对应设备行下面。 */
function attachTerminals(){
  if (!terminals.size) return;
  const tb = document.getElementById('rows');
  [...terminals.values()].forEach(t => {
    if (!t.open) return;
    const dev = devices.find(d => d.device_id === t.id);
    const host = dev ? [...tb.children].find(r => r.dataset && r.dataset.dev === t.id) : null;
    if (!host){ closeTerminal(t); return; }   // 设备记录没了，终端跟着收
    t.dev = dev;
    syncTerminalChrome(t);
    host.after(t.row);
  });
}

function rememberCommand(cmd){
  if (!cmd) return;
  if (localCmdHistory[localCmdHistory.length - 1] !== cmd) localCmdHistory.push(cmd);
  if (localCmdHistory.length > 200) localCmdHistory.shift();
}

function histStep(t, dir){
  const n = localCmdHistory.length;
  if (!n) return;
  if (dir < 0) t.histIdx = Math.max(0, Math.min(t.histIdx, n) - 1);
  else {
    if (t.histIdx >= n) { t.histIdx = n; return; }
    t.histIdx = Math.min(n, t.histIdx + 1);
  }
  t.input.value = t.histIdx >= n ? '' : localCmdHistory[t.histIdx];
  const end = t.input.value.length;
  try { t.input.setSelectionRange(end, end); } catch (_) {}
}

async function runCommand(t){
  if (t.input.disabled) return;
  if (t.busy){ toast('上一条命令还没返回，等它结束再发', 'err'); return; }
  const cmd = t.input.value.trim();
  if (!cmd) return;
  if (cmd.length > 4000){ toast('命令太长：协议上限 4000 字符', 'err'); return; }

  rememberCommand(cmd);
  t.input.value = '';
  t.histIdx = localCmdHistory.length;
  t.busy = true;
  t.runBtn.disabled = true;
  t.runBtn.textContent = '执行中…';
  t.cancelBtn.disabled = false;

  const entry = pushEntry(t, { command: cmd, status: 'queued' });
  setNote(entry, '已投递，等设备来取…', '');
  t.current = entry;
  t.startedAt = Date.now();

  try {
    const res = await api('POST', `/v1/devices/${encSeg(t.id)}/shell`, { command: cmd });
    if (t.closed) return;
    const jobId = res && (res.job_id || res.id);
    if (!jobId) throw new Error('服务器没返回 job_id');
    t.jobId = jobId;
    await pollUntilFinal(t, jobId, entry, t.startedAt);
  } catch (e){
    if (t.closed) return;
    setNote(entry, '投递失败：' + (e.message || '未知错误'), 'bad');
    toast(e.message || '投递失败', 'err');
    finishBusy(t);
  }
}

function pendingNote(status, waitedMs){
  const sec = Math.max(0, Math.round(waitedMs / 1000));
  if (status === 'running') return `设备执行中…（已等 ${sec} 秒）`;
  if (waitedMs < 8000) return '已投递，等设备来取…';
  return `等待设备执行…（已等 ${sec} 秒${sec >= 10 ? '，设备离线时会在它上线后执行' : ''}）`;
}

async function pollUntilFinal(t, jobId, entry, started){
  const token = Symbol('term-poll');
  t.pollToken = token;
  while (true){
    if (t.closed || t.pollToken !== token) return;
    let job = null;
    let err = null;
    try {
      const res = await api('GET',
        `/v1/devices/${encSeg(t.id)}/shell/${encSeg(jobId)}?wait=${TERM_WAIT_SECONDS}`);
      job = res && res.job ? res.job : res;
    } catch (e){ err = e; }
    if (t.closed || t.pollToken !== token) return;

    const waited = Date.now() - started;
    if (job){
      applyJob(entry, job);
      if (TERM_FINAL.indexOf(job.status) >= 0){
        finishBusy(t);
        // 只有在"本来就在这个终端里"时才抢焦点，别把用户正在改的名抢断
        const a = document.activeElement;
        if (!a || a === document.body || t.root.contains(a)) t.input.focus();
        return;
      }
      setNote(entry, pendingNote(job.status, waited), '');
    } else if (err){
      if (waited > TERM_MAX_WAIT_MS){
        setNote(entry, '查询结果一直失败，已停止等待：' + (err.message || '未知错误'), 'bad');
        finishBusy(t);
        toast('查询命令结果失败', 'err');
        return;
      }
      setNote(entry, '查询结果出错，重试中…（' + (err.message || '未知错误') + '）', 'bad');
    }
    if (waited > TERM_MAX_WAIT_MS){
      setNote(entry, '已等 120 秒还没返回，停止等待。命令可能仍在设备上执行，重开终端可从历史里看结果。', 'bad');
      // 停止轮询，但保留取消能力：卡住的命令多半还在排队，用户还能撤掉它
      t.pollToken = null;
      t.busy = false;
      t.runBtn.textContent = '执行';
      t.runBtn.disabled = t.input.disabled;
      t.cancelBtn.disabled = false;
      toast('等待设备执行超时（120 秒）', 'err');
      return;
    }
    await termSleep(t, TERM_POLL_GAP_MS);
  }
}

function finishBusy(t){
  t.busy = false;
  t.jobId = null;
  t.pollToken = null;
  if (t.closed) return;
  t.runBtn.textContent = '执行';
  t.runBtn.disabled = t.input.disabled;
  t.cancelBtn.disabled = true;
}

async function cancelJob(t){
  if (!t.jobId){ toast('当前没有可取消的命令', 'err'); return; }
  t.cancelBtn.disabled = true;
  try {
    const res = await api('POST',
      `/v1/devices/${encSeg(t.id)}/shell/${encSeg(t.jobId)}/cancel`, {});
    if (t.closed) return;
    if (res && res.canceled){
      if (t.current) setNote(t.current, '已取消（还没下发到设备）', 'bad');
      finishBusy(t);
      toast('已取消', 'ok');
    } else {
      t.cancelBtn.disabled = false;
      toast('命令已下发到设备，取消不了；等它跑完', 'err');
    }
  } catch (e){
    if (t.closed) return;
    t.cancelBtn.disabled = false;
    toast(e.message || '取消失败', 'err');
  }
}

function setNote(entry, text, kind){
  entry.note.textContent = text || '';
  entry.note.hidden = !text;
  entry.note.className = 'term-note' + (kind === 'bad' ? ' bad' : '');
}

function pushEntry(t, job, parent){
  const el = document.createElement('div');
  el.className = 'term-entry';
  el.innerHTML = `<div class="term-cmd">$ ${esc(job && job.command ? job.command : '')}</div>
    <div class="term-stdout" data-part="out" hidden></div>
    <div class="term-stderr" data-part="err" hidden></div>
    <div class="term-note" data-part="note" hidden></div>
    <div class="term-meta" data-part="meta" hidden></div>
    <div class="term-cut" data-part="cut" hidden>输出过长已截断</div>`;
  const hint = t.out.querySelector('.term-hint');
  if (hint) hint.remove();
  const box = parent || t.out;
  box.appendChild(el);
  if (box === t.out) termScrollToEnd(t);
  return {
    el,
    out: el.querySelector('[data-part="out"]'),
    err: el.querySelector('[data-part="err"]'),
    note: el.querySelector('[data-part="note"]'),
    meta: el.querySelector('[data-part="meta"]'),
    cut: el.querySelector('[data-part="cut"]'),
  };
}

/** 把一条 job 渲染进条目：stdout → stderr（暗红）→ 退出码/耗时 → 说明。未完成直接返回。 */
function applyJob(entry, job){
  if (!job) return;
  const status = job.status;
  if (status === 'queued' || status === 'running') return;

  const cap = (s) => {
    const str = String(s == null ? '' : s);
    return str.length > TERM_RENDER_CAP
      ? { text: str.slice(0, TERM_RENDER_CAP), cut: true }
      : { text: str, cut: false };
  };
  const so = cap(job.stdout);
  const se = cap(job.stderr);
  if (so.text){
    entry.out.hidden = false;
    entry.out.innerHTML = esc(so.text);
  } else if (!se.text){
    entry.out.hidden = false;
    entry.out.innerHTML = '<span class="term-hint">（无输出）</span>';
  } else {
    entry.out.hidden = true;
    entry.out.innerHTML = '';
  }
  entry.err.hidden = !se.text;
  entry.err.innerHTML = se.text ? esc(se.text) : '';

  const hasRc = job.rc !== null && job.rc !== undefined && Number.isFinite(Number(job.rc));
  const bits = [];
  if (hasRc) bits.push('退出码 ' + Number(job.rc));
  else if (status === 'timeout') bits.push('已超时');
  if (job.duration_ms != null) bits.push('耗时 ' + fmtMs(job.duration_ms));
  entry.meta.textContent = bits.join(' · ');
  entry.meta.hidden = !bits.length;
  const bad = (hasRc && Number(job.rc) !== 0) || status === 'timeout' || status === 'error';
  entry.meta.className = 'term-meta' + (bad ? ' bad' : '');

  let note = '';
  let noteBad = false;
  if (job.error){ note = '没跑起来：' + job.error; noteBad = true; }
  else if (status === 'timeout'){ note = '执行超时，设备侧已终止'; noteBad = true; }
  else if (status === 'canceled'){ note = '已取消（还没下发到设备）'; }
  else if (status === 'expired'){ note = '排队过期：设备一直没上线'; noteBad = true; }
  setNote(entry, note, noteBad ? 'bad' : '');

  entry.cut.hidden = !(job.truncated || so.cut || se.cut);
}

async function loadTermHistory(t){
  if (!t.out.querySelector('.term-entry')) {
    t.out.innerHTML = '<div class="term-hint">正在读取最近 20 条记录…</div>';
  }
  try {
    const res = await api('GET',
      `/v1/devices/${encSeg(t.id)}/shell/history?limit=${TERM_HISTORY_LIMIT}`);
    if (t.closed) return;
    const jobs = (res && res.jobs) || [];
    if (!jobs.length){
      if (!t.out.querySelector('.term-entry')) {
        t.out.innerHTML = '<div class="term-hint">这台设备还没执行过远程命令。输入命令，回车执行。</div>';
      }
      return;
    }
    // 历史插在现有条目上面：历史可能比用户刚发的命令慢回来，绝不能覆盖它。
    const frag = document.createDocumentFragment();
    jobs.slice().reverse().forEach(job => {   // 接口给的是倒序，页面里让最新的在最下面
      if (!job) return;
      const entry = pushEntry(t, job, frag);
      applyJob(entry, job);
      if (job.status === 'queued' || job.status === 'running'){
        setNote(entry, job.status === 'running' ? '仍在设备上执行…' : '仍在排队…', '');
      }
    });
    t.out.insertBefore(frag, t.out.firstChild);
    if (!t.busy) termScrollToEnd(t);
  } catch (e){
    if (t.closed) return;
    if (!t.out.querySelector('.term-entry')) {
      t.out.innerHTML = `<div class="term-hint">历史读取失败：${esc(e.message || '未知错误')}</div>`;
    }
  }
}

/* ── 启动 ───────────────────────────────────────── */
async function boot(){
  try {
    const meta = await api('GET', '/panel/api/meta');
    try {
      const w = document.getElementById('warnDefault');
      if (w) w.hidden = !meta.default_credentials;
    } catch (_) {}
    document.getElementById('hub-ver').textContent = 'v' + (meta.version || '') + ' · ' + (meta.data_dir || '');
  } catch (_) { /* 无关紧要 */ }
  await loadAll();
  if (timer) clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) loadAll(); }, 10000);
}

(async function start(){
  // 用 whoami 探活：未登录是**正常状态**，不该在 console 里留一条 401。
  try {
    const me = await api('GET', '/panel/api/whoami');
    if (me && me.logged_in) {
      showApp();
      await boot();
      return;
    }
  } catch (_) { /* 服务器不可达时也走登录页 */ }
  showLogin('');
})();
</script>
