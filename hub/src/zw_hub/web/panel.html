<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知纹 · 服务器端管理</title>
<style>
  :root{
    --bg:#0b0d12; --ink:#e8ebf2; --ink-2:#a8b0c0; --ink-3:#6f7889;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --glass:rgba(22,26,34,.72); --glass-2:rgba(30,35,45,.62);
    --accent:#5b9dff; --ok:#3ecf8e; --warn:#ffb020; --bad:#ff6b6b;
    --r:14px; --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    --sh:0 10px 30px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.22);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef1f6; --ink:#111722; --ink-2:#4a5567; --ink-3:#7b8798;
      --line:rgba(12,20,32,.10); --line-2:rgba(12,20,32,.18);
      --glass:rgba(255,255,255,.82); --glass-2:rgba(255,255,255,.66);
      --sh:0 12px 32px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.06);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    background:
      radial-gradient(1100px 520px at 12% -10%, rgba(91,157,255,.16), transparent 62%),
      radial-gradient(900px 460px at 92% 6%, rgba(62,207,142,.10), transparent 58%),
      var(--bg);
    font:14px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .glass{background:var(--glass); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--sh), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(26px) saturate(160%); -webkit-backdrop-filter:blur(26px) saturate(160%)}
  /* ── 登录 ───────────────────────────────────────── */
  #login{min-height:100vh; display:grid; place-items:center; padding:24px}
  .login-card{width:min(400px,94vw); padding:30px 28px}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:20px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#6fb0ff,#3b6fe0);
    display:grid;place-items:center;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(59,111,224,.4)}
  .brand b{font-size:16px;letter-spacing:.3px}
  .brand span{font-size:11px;color:var(--ink-3);display:block;margin-top:-2px}
  label{display:block;font-size:11.5px;color:var(--ink-2);margin:14px 0 6px;letter-spacing:.3px}
  input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);
    background:rgba(0,0,0,.20); color:var(--ink); font:inherit; font-family:var(--mono); font-size:13px}
  @media (prefers-color-scheme: light){ input{background:rgba(255,255,255,.8)} }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.16)}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line-2);
    background:var(--glass-2);color:var(--ink);padding:9px 15px;transition:.16s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:linear-gradient(180deg,#5fa2ff,#3f7fe8);border-color:transparent;color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.07);color:#fff}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  button.sm{padding:5px 10px;font-size:12px}
  .btn-block{width:100%;margin-top:20px;padding:11px}
  .err{color:var(--bad);font-size:12.5px;margin-top:12px;min-height:18px}
  .shake{animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  /* ── 主界面 ─────────────────────────────────────── */
  #app{display:none; min-height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:14px 24px;
    border-bottom:1px solid var(--line);background:var(--glass);
    backdrop-filter:blur(22px);position:sticky;top:0;z-index:5}
  header h1{font-size:14.5px;margin:0;font-weight:640;letter-spacing:.3px}
  header .sub{font-size:11px;color:var(--ink-3);margin-left:2px}
  .grow{flex:1}
  main{padding:22px 24px 60px;max-width:1180px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{padding:14px 16px}
  .kpi b{display:block;font-size:24px;font-weight:680;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px;color:var(--ink-3)}
  .card{padding:16px 18px;margin-bottom:16px}
  .card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .card-h h2{font-size:12px;margin:0;color:var(--ink-3);font-weight:620;letter-spacing:.9px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;color:var(--ink-3);font-weight:560;padding:8px 10px;
    border-bottom:1px solid var(--line);letter-spacing:.4px;white-space:nowrap}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:rgba(255,255,255,.035)}
  .mono{font-family:var(--mono);font-size:12px}
  .dim{color:var(--ink-3)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
  .dot.off{background:var(--ink-3)}
  .dot.rev{background:var(--bad);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
    border:1px solid var(--line-2);color:var(--ink-2)}
  .badge.ok{color:var(--ok);border-color:rgba(62,207,142,.4);background:rgba(62,207,142,.10)}
  .badge.bad{color:var(--bad);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.10)}
  .badge.warn{color:var(--warn);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.10)}
  .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .empty{padding:34px;text-align:center;color:var(--ink-3);font-size:13px}
  #toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .tmsg{padding:10px 14px;border-radius:10px;font-size:13px;max-width:420px;
    background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--accent);box-shadow:var(--sh)}
  .tmsg.ok{border-left-color:var(--ok)} .tmsg.err{border-left-color:var(--bad)}
  dialog{border:1px solid var(--line-2);border-radius:16px;padding:0;color:var(--ink);
    background:var(--glass);box-shadow:var(--sh);width:min(460px,92vw);
    backdrop-filter:blur(28px) saturate(160%)}
  @media (prefers-color-scheme: light){ dialog{background:#fff} }
  dialog::backdrop{background:rgba(4,7,12,.6);backdrop-filter:blur(3px)}
  .dlg-h{padding:18px 20px 8px;font-weight:620;font-size:15px}
  .dlg-b{padding:6px 20px 14px;font-size:13px;color:var(--ink-2)}
  .dlg-f{display:flex;justify-content:flex-end;gap:9px;padding:12px 20px;border-top:1px solid var(--line)}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.65}
  code{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>

<!-- 登录层 -->
<div id="login">
  <form class="glass login-card" id="login-form" autocomplete="off">
    <div class="brand">
      <div class="logo">知</div>
      <div><b>知纹 · 服务器端</b><span>设备与同步中心管理</span></div>
    </div>
    <label>登录名</label>
    <input id="u" name="username" autocomplete="username" required>
    <label>密码</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="login-err"></div>
    <button class="primary btn-block" type="submit">登录</button>
    <div class="hint">这是你自己服务器的管理面板。忘记密码就看部署机上 <code>/opt/zhiwen-hub/.env</code> 里的 ZW_PANEL_PASSWORD。</div>
  </form>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <div class="logo" style="width:26px;height:26px;border-radius:7px;font-size:12px">知</div>
    <h1>服务器端管理</h1>
    <span class="sub" id="hub-ver"></span>
    <div class="grow"></div>
    <span class="dim" style="font-size:11.5px" id="refresh-hint"></span>
    <button class="sm" id="btn-refresh">刷新</button>
    <button class="sm" id="btn-logout">退出</button>
  </header>
  <main>
    <div class="kpis" id="kpis"></div>

    <div class="glass card">
      <div class="card-h">
        <h2>已连接过的电脑</h2>
        <div class="grow"></div>
        <span class="dim" style="font-size:11.5px">机器码由客户端首次启动时生成，删配置才会变</span>
      </div>
      <div style="overflow:auto">
        <table>
          <thead><tr>
            <th style="min-width:170px">设备</th><th>状态</th><th>本机环境</th><th>平台</th>
            <th>最近在线</th><th>IP</th><th class="mono">机器码</th><th style="text-align:right">操作</th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="empty">读取中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="glass card">
      <div class="card-h"><h2>最近事件</h2><div class="grow"></div>
        <span class="dim" style="font-size:11.5px">谁注册了、谁被踢了</span></div>
      <div id="events" class="mono dim" style="font-size:12px;line-height:1.9;max-height:260px;overflow:auto">读取中…</div>
    </div>
  </main>
</div>

<div id="toast"></div>

<dialog id="dlg">
  <div class="dlg-h" id="dlg-title">确认</div>
  <div class="dlg-b" id="dlg-body"></div>
  <div class="dlg-f">
    <button class="sm" id="dlg-cancel">取消</button>
    <button class="sm danger" id="dlg-ok">确认</button>
  </div>
</dialog>

<script>
'use strict';
const API = '';
let devices = [];
let timer = null;

function toast(msg, kind){
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'tmsg ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = '.4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); },
             kind === 'err' ? 6500 : 3000);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtAgo(sec){
  if (sec == null) return '—';
  if (sec < 10) return '刚刚';
  if (sec < 60) return sec + ' 秒前';
  if (sec < 3600) return Math.floor(sec / 60) + ' 分钟前';
  if (sec < 86400) return Math.floor(sec / 3600) + ' 小时前';
  return Math.floor(sec / 86400) + ' 天前';
}

async function api(method, path, body){
  const opt = { method, headers: {}, credentials: 'same-origin' };
  if (body !== undefined){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(API + path, opt);
  let data = null;
  try { data = await r.json(); } catch (_) { data = { ok: false, code: 'BAD_RESPONSE', message: '返回不是 JSON' }; }
  if (r.status === 401 && path !== '/panel/api/login'){
    showLogin('登录已过期，请重新登录');
    throw new Error('未登录');
  }
  if (data && data.ok === false) throw new Error(`[${data.code}] ${data.message}`);
  return data && data.data !== undefined ? data.data : data;
}

function showLogin(msg){
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'grid';
  document.getElementById('login-err').textContent = msg || '';
  if (timer) { clearInterval(timer); timer = null; }
}
function showApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

document.getElementById('login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const errBox = document.getElementById('login-err');
  errBox.textContent = '';
  try {
    await api('POST', '/panel/api/login', { username: u, password: p });
    showApp();
    await boot();
  } catch (e) {
    errBox.textContent = e.message;
    const card = document.querySelector('.login-card');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 320);
  }
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await api('POST', '/panel/api/logout', {}).catch(() => {});
  showLogin('已退出');
});
document.getElementById('btn-refresh').addEventListener('click', () => loadAll(true));

function kvState(d){
  if (d.status === 'revoked') return '<span class="badge bad"><i class="dot rev"></i>已踢下线</span>';
  if (d.online) return '<span class="badge ok"><i class="dot on"></i>在线</span>';
  return '<span class="badge"><i class="dot off"></i>离线</span>';
}

function renderKpis(st){
  const items = [
    ['在线', st.online, '最近 ' + Math.round((st.online_window_seconds || 180) / 60) + ' 分钟内有心跳'],
    ['环境总数', st.total_profiles ?? 0, '所有在线设备上报之和'],
    ['正在运行', st.total_running ?? 0, '所有在线设备上报之和'],
    ['已踢下线', st.revoked, '这些设备现在连不上'],
    ['累计设备', st.total, '含已删除前见过的'],
  ];
  document.getElementById('kpis').innerHTML = items.map(([k, v, hint]) =>
    `<div class="glass kpi"><b>${esc(v)}</b><span>${esc(k)}</span>
      <div class="hint" style="margin-top:2px">${esc(hint)}</div></div>`).join('');
}

/** 本机环境概况。客户端心跳会带 profiles/running；老客户端没有就显示 —。 */
function envCell(d){
  const n = Number(d.profiles || 0);
  const r = Number(d.running || 0);
  if (!n && !r) return '<span class="muted">—</span>';
  const cls = r > 0 ? 'ok' : '';
  const disk = d.disk_human ? `<div class="dim" style="font-size:10.5px">${esc(d.disk_human)}</div>` : '';
  return `<span class="badge ${cls}">${esc(n)} 个 · ${esc(r)} 运行</span>${disk}`;
}

function renderRows(){
  const tb = document.getElementById('rows');
  if (!devices.length){
    tb.innerHTML = `<tr><td colspan="8" class="empty">还没有任何电脑连过这台服务器。<br>
      <span style="font-size:12px">装好客户端，填上本机地址就能用了。</span></td></tr>`;
    return;
  }
  tb.innerHTML = devices.map(d => {
    const id = esc(d.device_id);
    const revoked = d.status === 'revoked';
    return `<tr>
      <td>
        <div style="font-weight:560">${esc(d.label || d.hostname || '未命名设备')}</div>
        <div class="dim" style="font-size:11px">${esc(d.hostname || '')}${d.app_version ? ' · v' + esc(d.app_version) : ''}</div>
      </td>
      <td>${kvState(d)}</td>
      <td class="mono">${envCell(d)}</td>
      <td class="mono dim">${esc(d.platform || '—')}${d.arch ? ' / ' + esc(d.arch) : ''}</td>
      <td class="dim">${esc(fmtAgo(d.last_seen_ago))}</td>
      <td class="mono dim">${esc(d.last_ip || '—')}</td>
      <td class="mono dim" title="${id}">${esc(d.device_id.slice(0, 10))}…</td>
      <td><div class="acts">
        ${revoked
          ? `<button class="sm" data-act="restore" data-id="${id}">恢复</button>`
          : `<button class="sm danger" data-act="revoke" data-id="${id}">踢下线</button>`}
        <button class="sm" data-act="rename" data-id="${id}">改名</button>
        <button class="sm danger" data-act="delete" data-id="${id}">删除</button>
      </div></td>
    </tr>`;
  }).join('');
}

function renderEvents(list){
  const box = document.getElementById('events');
  if (!list.length){ box.innerHTML = '<span class="dim">还没有事件。</span>'; return; }
  const map = { enroll: '注册', revoke: '踢下线', restore: '恢复', delete: '删除' };
  box.innerHTML = list.map(e => {
    const t = new Date(e.ts * 1000).toLocaleString('zh-CN', { hour12: false });
    const act = map[e.action] || e.action;
    const who = e.actor ? ` by ${esc(e.actor)}` : '';
    return `<div><span class="dim">${esc(t)}</span>  <b>${esc(act)}</b>${who}  <span class="dim mono">${esc((e.device_id || '').slice(0, 10))}</span></div>`;
  }).join('');
}

async function loadAll(showToast){
  try {
    const [st, list, ev] = await Promise.all([
      api('GET', '/panel/api/stats'),
      api('GET', '/panel/api/devices'),
      api('GET', '/panel/api/events?limit=40'),
    ]);
    renderKpis(st);
    devices = list.devices || [];
    renderRows();
    renderEvents(ev.events || []);
    document.getElementById('refresh-hint').textContent = '已更新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    if (showToast) toast('已刷新', 'ok');
  } catch (e) {
    if (e.message !== '未登录') toast(e.message, 'err');
  }
}

document.getElementById('rows').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  const dev = devices.find(x => x.device_id === id) || {};
  const name = dev.label || dev.hostname || id.slice(0, 10);

  if (act === 'revoke'){
    askConfirm(`把「${name}」踢下线？`, '踢下线后这台电脑立即连不上服务器，它的同步与注册请求都会返回 403 DEVICE_REVOKED。随时可以点「恢复」放回来。', async () => {
      await api('POST', `/panel/api/devices/${encodeURIComponent(id)}/revoke`, { note: '面板手动踢下线' });
      toast(`${name} 已踢下线`, 'ok');
      await loadAll();
    });
  } else if (act === 'restore'){
    await api('POST', `/panel/api/devices/${encodeURIComponent(id)}/restore`, {});
    toast(`${name} 已恢复`, 'ok');
    await loadAll();
  } else if (act === 'rename'){
    askText(`给设备改名`, '只影响面板显示，不影响那台电脑', dev.label || '', async (v) => {
      if (!v.trim()) return;
      await api('PATCH', `/panel/api/devices/${encodeURIComponent(id)}`, { label: v.trim() });
      await loadAll();
    });
  } else if (act === 'delete'){
    askConfirm(`删除设备记录「${name}」？`, '只删服务器上的记录。那台电脑下次启动会作为"新设备"重新出现（因为它的机器码还在本地）。想永久禁止，用踢下线。', async () => {
      await api('DELETE', `/panel/api/devices/${encodeURIComponent(id)}`, {});
      toast('已删除', 'ok');
      await loadAll();
    });
  }
});

/* ── 小弹窗 ─────────────────────────────────────── */
let dlgAction = null;
function openDlg(title, body, onOk){
  document.getElementById('dlg-title').textContent = title;
  document.getElementById('dlg-body').innerHTML = body;
  dlgAction = onOk;
  const d = document.getElementById('dlg');
  if (!d.open) d.showModal();
}
function askConfirm(title, body, onOk){
  openDlg(title, `<div>${esc(body)}</div>`, onOk);
}
function askText(title, body, initial, onOk){
  openDlg(title, `<div class="dim" style="margin-bottom:10px">${esc(body)}</div>
    <input id="dlg-input" value="${esc(initial || '')}" style="width:100%">`, onOk);
  setTimeout(() => {
    const el = document.getElementById('dlg-input');
    if (el){ el.focus(); el.select(); el.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('dlg-ok').click(); }); }
  }, 40);
}
document.getElementById('dlg-cancel').addEventListener('click', () => document.getElementById('dlg').close());
document.getElementById('dlg-ok').addEventListener('click', async () => {
  const btn = document.getElementById('dlg-ok');
  const input = document.getElementById('dlg-input');
  const val = input ? input.value : undefined;
  btn.disabled = true;
  try {
    if (dlgAction) await dlgAction(val);
    document.getElementById('dlg').close();
  } catch (e) { toast(e.message, 'err'); }
  finally { btn.disabled = false; }
});

/* ── 启动 ───────────────────────────────────────── */
async function boot(){
  try {
    const meta = await api('GET', '/panel/api/meta');
    document.getElementById('hub-ver').textContent = 'v' + (meta.version || '') + ' · ' + (meta.data_dir || '');
  } catch (_) { /* 无关紧要 */ }
  await loadAll();
  if (timer) clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) loadAll(); }, 10000);
}

(async function start(){
  // 用 whoami 探活：未登录是**正常状态**，不该在 console 里留一条 401。
  try {
    const me = await api('GET', '/panel/api/whoami');
    if (me && me.logged_in) {
      showApp();
      await boot();
      return;
    }
  } catch (_) { /* 服务器不可达时也走登录页 */ }
  showLogin('');
})();
</script>
